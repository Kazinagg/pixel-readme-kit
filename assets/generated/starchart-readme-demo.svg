<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(18, 18, 18, 0.95);
        --bg-panel: rgba(28, 28, 28, 0.90);
        --border-chassis: #E0E0E0;
        --primary: #A78BFA;
        --accent: #6EE7B7;
        --tertiary: #FDE047;
        --title-front: #F3F4F6;
        --title-mid: #E0E0E0;
        --title-dark: #A78BFA;
        --text-main: #F3F4F6;
        --text-dim: #9CA3AF;
        --status: #6EE7B7;
        --warning: #FDE047;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(18, 18, 18, 0.95);
          --bg-panel: rgba(28, 28, 28, 0.90);
          --border-chassis: #E0E0E0;
          --primary: #A78BFA;
          --accent: #6EE7B7;
          --tertiary: #FDE047;
          --title-front: #F3F4F6;
          --title-mid: #E0E0E0;
          --title-dark: #A78BFA;
          --text-main: #F3F4F6;
          --text-dim: #9CA3AF;
          --status: #6EE7B7;
          --warning: #FDE047;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FDFDFD;
          --bg-panel: #F4F4F5;
          --border-chassis: #1F2937;
          --primary: #4F46E5;
          --accent: #059669;
          --tertiary: #D97706;
          --title-front: #111827;
          --title-mid: #374151;
          --title-dark: #4F46E5;
          --text-main: #111827;
          --text-dim: #4B5563;
          --status: #059669;
          --warning: #D97706;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #A78BFA));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sketch { font-family: 'Virgil', 'Architects Daughter', 'Comic Shanns', 'Kalam', 'Chalkboard SE', 'Comic Sans MS', 'Casual', cursive, sans-serif; }
    .font-sketch-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sketch-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .sketch-hover:hover { opacity: 0.85; transform: scale(1.01); }

    </style>
    <pattern id="starSketch-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
