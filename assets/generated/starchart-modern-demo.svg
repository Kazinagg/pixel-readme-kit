<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
        <linearGradient id="modern-starchart-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
    <linearGradient id="modern-starchart-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.6" />
      <stop offset="100%" stop-color="var(--border-chassis)" stop-opacity="0.3" />
    </linearGradient>
    <style>
      
      :root {
        --bg-glass: rgba(8, 9, 13, 0.94);
        --bg-panel: rgba(18, 19, 29, 0.88);
        --border-chassis: rgba(45, 43, 67, 0.85);
        --primary: #8B5CF6;
        --accent: #C084FC;
        --tertiary: #A855F7;
        --title-front: #A78BFA;
        --title-mid: #7C3AED;
        --title-dark: #4C1D95;
        --text-main: #F5F3FF;
        --text-dim: #A78BFA;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(8, 9, 13, 0.94);
          --bg-panel: rgba(18, 19, 29, 0.88);
          --border-chassis: rgba(45, 43, 67, 0.85);
          --primary: #8B5CF6;
          --accent: #C084FC;
          --tertiary: #A855F7;
          --title-front: #A78BFA;
          --title-mid: #7C3AED;
          --title-dark: #4C1D95;
          --text-main: #F5F3FF;
          --text-dim: #A78BFA;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FAF5FF;
          --bg-panel: #F3E8FF;
          --border-chassis: #E9D5FF;
          --primary: #6D28D9;
          --accent: #7C3AED;
          --tertiary: #8B5CF6;
          --title-front: #5B21B6;
          --title-mid: #6D28D9;
          --title-dark: #7C3AED;
          --text-main: #2E1065;
          --text-dim: #6B21A8;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #8B5CF6));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
    <linearGradient id="modern-star-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- MODERN CHASSIS -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="var(--bg-glass)" stroke="url(#modern-starchart-border-grad)" stroke-width="1.2"/>
  <path d="M 16 2 L 834 2" stroke="url(#modern-starchart-accent-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- HEADER -->
  <g transform="translate(20, 18)">
    <circle cx="8" cy="14" r="3.5" fill="var(--status)"/>
    <text x="18" y="18" fill="var(--text-main)" font-size="12" font-weight="700" letter-spacing="0.03em" class="font-sans">OPEN SOURCE TRAJECTORY // CUBIC BEZIER</text>
    <text x="289" y="18" fill="var(--text-dim)" font-size="11" class="font-mono">/ Kazinagg/readme-kit</text>
  </g>

  <!-- STATS PILLS -->
  <g transform="translate(636, 18)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
    <text x="43" y="16" fill="var(--primary)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 4,900</text>
    <rect x="94" y="0" width="100" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="144" y="16" fill="var(--accent)" font-size="10.5" font-weight="600" text-anchor="middle" class="font-sans">+114% past 6m</text>
  </g>

  <!-- GRID & AXES -->
  <line x1="65" y1="186.0" x2="810" y2="186.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="146.7" x2="810" y2="146.7" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="107.3" x2="810" y2="107.3" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="68.0" x2="810" y2="68.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <text x="55" y="189.5" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">0</text><text x="55" y="150.2" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">1.6k</text><text x="55" y="110.8" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">3.3k</text><text x="55" y="71.5" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">4.9k</text>
  <text x="65.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-5</text><text x="214.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-4</text><text x="363.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-3</text><text x="512.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-2</text><text x="661.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-1</text><text x="810.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">NOW</text>

  <!-- CHART AREA & BEZIER SPLINE -->
  <path d="M 65.0 186 L 65.0 185.0 C 132.1 185.0, 146.9 182.4, 214.0 182.4 C 281.1 182.4, 295.9 173.5, 363.0 173.5 C 430.1 173.5, 444.9 153.5, 512.0 153.5 C 579.0 153.5, 594.0 118.6, 661.0 118.6 C 728.0 118.6, 743.0 68.0, 810.0 68.0 L 810.0 186 Z" fill="url(#modern-star-area)" shape-rendering="geometricPrecision"/>
  <path d="M 65.0 185.0 C 132.1 185.0, 146.9 182.4, 214.0 182.4 C 281.1 182.4, 295.9 173.5, 363.0 173.5 C 430.1 173.5, 444.9 153.5, 512.0 153.5 C 579.0 153.5, 594.0 118.6, 661.0 118.6 C 728.0 118.6, 743.0 68.0, 810.0 68.0" fill="none" stroke="url(#modern-starchart-accent-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision"/>

  <!-- DATA VERTICES -->
  <circle cx="65.0" cy="185.0" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="214.0" cy="182.4" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="363.0" cy="173.5" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="512.0" cy="153.5" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="661.0" cy="118.6" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/>
    <!-- Peak Milestone Marker -->
    <circle cx="810.0" cy="68.0" r="8" fill="var(--accent)" opacity="0.2"/>
    <circle cx="810.0" cy="68.0" r="5" fill="var(--bg-glass)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="810.0" cy="68.0" r="2" fill="var(--primary)"/>
    <!-- Peak Callout Pill -->
    <g transform="translate(760.0, 38.0)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="38" y="15" fill="var(--accent)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 4,900</text>
    </g>
</svg>