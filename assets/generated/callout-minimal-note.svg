<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F8FAFC;
        --bg-panel: #F1F5F9;
        --border-chassis: #E2E8F0;
        --primary: #1D4ED8;
        --accent: #6D28D9;
        --title-front: #1D4ED8;
        --title-mid: #1E40AF;
        --title-dark: #0F172A;
        --text-main: #0F172A;
        --text-dim: #64748B;
        --status: #16A34A;
        --warning: #D97706;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 18, 30, 0.85);
          --bg-panel: rgba(22, 27, 46, 0.80);
          --border-chassis: rgba(41, 46, 66, 0.85);
          --primary: #4F8BFF;
          --accent: #A855F7;
          --title-front: #4F8BFF;
          --title-mid: #2563EB;
          --title-dark: #1E3A8A;
          --text-main: #F1F5F9;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Body Chassis -->
  <rect x="1" y="2" width="848" height="44" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.5"/>
  <!-- Badges & Accents -->
  <rect x="16" y="11" width="130" height="26" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/><text x="81" y="28" fill="var(--primary)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">INFO // MINIMAL</text>
  <path d="M 5 12 L 5 5 L 14 5" fill="none" stroke="var(--primary)" stroke-width="1.5"/><path d="M 845 12 L 845 5 L 836 5" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <!-- Text Content (Properly offset past badge edge) -->
  <text x="158" y="22" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">INFO // СИСТЕМНОЕ СООБЩЕНИЕ</text>
  <text x="158" y="36" fill="var(--accent)" font-size="9" class="font-mono">Микроточечный распад и волосяная рамка</text>
</svg>