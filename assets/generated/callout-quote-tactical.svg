<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 42" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #FFFBEB;
        --bg-panel: #FEF3C7;
        --border-chassis: #FDE68A;
        --primary: #B45309;
        --accent: #C2410C;
        --title-front: #B45309;
        --title-mid: #78350F;
        --title-dark: #451A03;
        --text-main: #1F2937;
        --text-dim: #6B7280;
        --status: #15803D;
        --warning: #B45309;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Background Glass (Flush left to connect with markdown quote border) -->
  <rect x="0" y="0" width="850" height="42" fill="var(--bg-glass)"/>
  <!-- Top Rail -->
  <line x1="0" y1="2" x2="838" y2="2" stroke="var(--primary)" stroke-width="2"/><line x1="838" y1="2" x2="849" y2="13" stroke="var(--primary)" stroke-width="2"/><line x1="849" y1="13" x2="849" y2="38" stroke="var(--primary)" stroke-width="2"/>
  <!-- Badge -->
  <polygon points="6 6, 12 6, 4 18, 0 18" fill="var(--primary)" opacity="0.6"/><polygon points="16 6, 22 6, 14 18, 8 18" fill="var(--primary)" opacity="0.6"/><polygon points="28 8, 165 8, 172 15, 172 27, 165 34, 28 34" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><text x="96" y="24" fill="var(--primary)" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">▲ WARNING // HAZARD</text>
  <!-- Title & Subtitle (Properly offset past badge edge) -->
  <text x="186" y="20" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">TACTICAL QUOTE HEADER</text>
  <text x="186" y="33" fill="var(--accent)" font-size="8.5" class="font-mono">Шевроны и скос 45° на открытом контуре</text>
  <!-- DASHED BOTTOM LINE: Bridges into live markdown text -->
  <line x1="0" y1="41" x2="845" y2="41" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.75"/>
  <polygon points="840 37, 848 37, 844 41" fill="var(--primary)"/>
</svg>