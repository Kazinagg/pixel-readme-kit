<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 42" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #92400E;
        --title-dark: #451A03;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #B45309;
          --accent: #C2410C;
          --tertiary: #B91C1C;
          --title-front: #B45309;
          --title-mid: #78350F;
          --title-dark: #451A03;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Background Glass (Flush left to connect with markdown quote border) -->
  <rect x="0" y="0" width="850" height="42" fill="var(--bg-glass)"/>
  <!-- Top Rail -->
  <line x1="0" y1="2" x2="849" y2="2" stroke="#d29922" stroke-width="2"/><line x1="849" y1="2" x2="849" y2="38" stroke="#d29922" stroke-width="2"/><rect x="844" y="2" width="5" height="5" fill="#d29922"/>
  <!-- Badge -->
  <rect x="8" y="8" width="123" height="24" fill="var(--bg-panel)" stroke="#d29922" stroke-width="1.5"/><circle cx="20" cy="20" r="3.5" fill="#d29922"/><text x="75" y="24" fill="#d29922" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">WARNING // 0x01</text>
  <!-- Title & Subtitle (Properly offset past badge edge) -->
  <text x="145" y="20" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">TACTICAL QUOTE HEADER</text>
  <text x="145" y="33" fill="var(--accent)" font-size="11" class="font-mono">Шевроны и скос 45° на открытом контуре</text>
  <!-- DASHED BOTTOM LINE: Bridges into live markdown text -->
  <line x1="0" y1="41" x2="845" y2="41" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.75"/>
  
</svg>