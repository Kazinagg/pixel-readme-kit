<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 28" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(18, 18, 18, 0.95);
        --bg-panel: rgba(28, 28, 28, 0.90);
        --border-chassis: #E0E0E0;
        --primary: #A78BFA;
        --accent: #6EE7B7;
        --tertiary: #FDE047;
        --title-front: #F3F4F6;
        --title-mid: #E0E0E0;
        --title-dark: #A78BFA;
        --text-main: #F3F4F6;
        --text-dim: #9CA3AF;
        --status: #6EE7B7;
        --warning: #FDE047;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(18, 18, 18, 0.95);
          --bg-panel: rgba(28, 28, 28, 0.90);
          --border-chassis: #E0E0E0;
          --primary: #A78BFA;
          --accent: #6EE7B7;
          --tertiary: #FDE047;
          --title-front: #F3F4F6;
          --title-mid: #E0E0E0;
          --title-dark: #A78BFA;
          --text-main: #F3F4F6;
          --text-dim: #9CA3AF;
          --status: #6EE7B7;
          --warning: #FDE047;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FDFDFD;
          --bg-panel: #F4F4F5;
          --border-chassis: #1F2937;
          --primary: #4F46E5;
          --accent: #059669;
          --tertiary: #D97706;
          --title-front: #111827;
          --title-mid: #374151;
          --title-dark: #4F46E5;
          --text-main: #111827;
          --text-dim: #4B5563;
          --status: #059669;
          --warning: #D97706;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #A78BFA));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sketch { font-family: 'Virgil', 'Architects Daughter', 'Comic Shanns', 'Kalam', 'Chalkboard SE', 'Comic Sans MS', 'Casual', cursive, sans-serif; }
    .font-sketch-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sketch-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .sketch-hover:hover { opacity: 0.85; transform: scale(1.01); }

    </style>
    <pattern id="dividerSketch-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--primary)" stroke-width="1.3" opacity="0.45" />
    </pattern>
    <pattern id="dividerSketch-crosshatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
      <line x1="0" y1="0" x2="12" y2="0" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <pattern id="dividerSketch-hatch-accent" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--accent)" stroke-width="1.3" opacity="0.5" />
    </pattern>
    <linearGradient id="dividerSketch-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Wobbly Sketch Divider Stroke -->
  <path d="M 23.66 14.17 Q 423.24 13.01 826.11 14.62" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 24.12 14.53 Q 425.82 14.21 825.36 13.78" stroke="var(--primary)" stroke-width="1.27" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Center Doodle Star -->
  <circle cx="425" cy="14" r="11" fill="none" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <path d="M 424.4,6.9 L 428.5,19.3 L 418.8,11.4 L 431.5,12.1 L 421.9,18.6 L 424.6,7.5" stroke="var(--tertiary)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="var(--accent)" />
</svg>