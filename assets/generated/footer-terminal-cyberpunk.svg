<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 54" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #00C8D7; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <!-- Cyberpunk Chassis -->
  <rect x="1" y="2" width="848" height="50" fill="rgba(10, 14, 23, 0.85)" stroke="rgba(30, 41, 59, 0.85)" stroke-width="2"/>
  <rect x="4" y="5" width="842" height="44" fill="none" stroke="#00C8D7" stroke-width="1" opacity="0.75"/>
  <rect x="1" y="2" width="5" height="5" fill="#00C8D7"/>
  <rect x="844" y="2" width="5" height="5" fill="#00C8D7"/>
  <rect x="1" y="47" width="5" height="5" fill="#00C8D7"/>
  <rect x="844" y="47" width="5" height="5" fill="#00C8D7"/>
  <!-- LED Indicator & Status -->
  <circle cx="28" cy="27" r="4" fill="#00C8D7" class="led"/>
  <text x="45" y="31" fill="#00C8D7" font-size="11" font-weight="bold" class="font-mono">SYSTEM_ONLINE // BUFFER_FLUSHED</text>
  <!-- Return to Top Button -->
  <rect x="660" y="12" width="170" height="30" fill="rgba(0, 200, 215, 0.15)" stroke="#00C8D7" stroke-width="1.5"/>
  <text x="745" y="31" fill="#00C8D7" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">[ ▲ RETURN TO TOP ]</text>
</svg>