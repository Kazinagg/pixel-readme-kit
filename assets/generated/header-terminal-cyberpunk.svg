<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ledFlicker { 0%, 100% { fill: #00C8D7; } 50% { fill: #005577; } }
      @keyframes crtScanline {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 0.35; }
        80% { opacity: 0.35; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      .cursor-blink { animation: blink 1s infinite steps(1); }
      .status-led { animation: ledFlicker 1.8s infinite steps(1); }
      .crt-scan { animation: crtScanline 3.5s infinite linear; }
    </style>
  </defs>
  <!-- Cyberpunk Translucent Glass Body -->
  <rect x="1" y="2" width="848" height="256" fill="rgba(10, 14, 23, 0.85)" stroke="rgba(30, 41, 59, 0.85)" stroke-width="2"/>
  <rect x="4" y="5" width="842" height="250" fill="none" stroke="#00C8D7" stroke-width="1" opacity="0.75"/>
  <!-- Corner Pixel Anchors (3x3) -->
  <rect x="1" y="2" width="6" height="6" fill="#00C8D7"/>
  <rect x="843" y="2" width="6" height="6" fill="#00C8D7"/>
  <rect x="1" y="252" width="6" height="6" fill="#00C8D7"/>
  <rect x="843" y="252" width="6" height="6" fill="#00C8D7"/>
  <!-- CRT Scanline Simulation -->
  <line x1="4" y1="0" x2="846" y2="0" stroke="#00C8D7" stroke-width="1.5" class="crt-scan"/>
  <!-- Title Badge -->
  <rect x="42" y="24" width="165" height="24" fill="rgba(0, 200, 215, 0.15)" stroke="#00C8D7" stroke-width="1.5"/>
  <circle cx="56" cy="36" r="4" fill="#00C8D7" class="status-led"/>
  <text x="120" y="40" fill="#00C8D7" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">SYS_CORE_v2.2</text>
  <!-- Main Title -->
  <text x="42" y="98" fill="#F8F8F2" font-size="30" font-weight="bold" letter-spacing="2" class="font-mono">CYBERPUNK TERMINAL</text>
  <text x="42" y="130" fill="#A855F7" font-size="12" font-weight="bold" class="font-mono"># RADAR 360 // CRT SCANLINE // SPEC MATRIX</text>
  <!-- Specs Teletype -->
  
            <text x="42" y="175" fill="#00C8D7" font-size="12" font-weight="bold" class="font-mono">&gt;</text>
            <text x="60" y="175" fill="#F8F8F2" font-size="11" class="font-mono">HUD ARCHITECTURE:</text>
            <text x="210" y="175" fill="#A855F7" font-size="11" font-weight="bold" class="font-mono">TRANSLUCENT GLASS // ZERO ADAPTERS</text>
            
            <text x="42" y="197" fill="#00C8D7" font-size="12" font-weight="bold" class="font-mono">&gt;</text>
            <text x="60" y="197" fill="#F8F8F2" font-size="11" class="font-mono">TEXT INTEGRATION:</text>
            <text x="210" y="197" fill="#A855F7" font-size="11" font-weight="bold" class="font-mono">100% COPYABLE MARKDOWN &amp; MATH</text>
            
            <text x="42" y="219" fill="#00C8D7" font-size="12" font-weight="bold" class="font-mono">&gt;</text>
            <text x="60" y="219" fill="#F8F8F2" font-size="11" class="font-mono">ANIMATION SUITE:</text>
            <text x="210" y="219" fill="#A855F7" font-size="11" font-weight="bold" class="font-mono">LIVE RADAR // SCANLINE // EQUALIZER</text>
            
  <!-- 360° Rotating Radar on Right -->
  <g transform="translate(720, 125)">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00C8D7" stroke-width="1.5" opacity="0.65"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00C8D7" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00C8D7" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="3" fill="#00C8D7"/>
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#00C8D7" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#00C8D7" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="52" y2="-38" stroke="#A855F7" stroke-width="2" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </line>
    <text x="0" y="82" fill="#00C8D7" font-size="9" text-anchor="middle" class="font-mono">[RADAR 360° ACTIVE]</text>
  </g>
</svg>