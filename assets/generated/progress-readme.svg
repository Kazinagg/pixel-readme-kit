    <rect x="735.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="760.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="786.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="812.2" y="28" width="23.8" height="14" fill="var(--accent)" fill-opacity="1.0"/>
  </g>

  <!-- Subtext & Milestone Ticks -->
  <text x="14" y="56" fill="var(--text-dim)" class="font-prog-sub">MULTI-STYLE ARCHITECTURE // STAR CHART // PROFILE DOSSIER</text>
  <text x="836" y="56" fill="var(--text-dim)" text-anchor="end" class="font-prog-sub">0% ── 50% ── 100%</text>
</svg>