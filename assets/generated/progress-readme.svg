<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 68" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 14, 23, 0.85);
        --bg-panel: rgba(15, 23, 38, 0.82);
        --border-chassis: rgba(30, 41, 59, 0.85);
        --primary: #00C8D7;
        --accent: #A855F7;
        --tertiary: #FF0055;
        --title-front: #00C8D7;
        --title-mid: #006B74;
        --title-dark: #002B2F;
        --text-main: #F8F8F2;
        --text-dim: #94A3B8;
        --status: #00D26A;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-prog-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-prog-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; font-weight: 900; }
      .font-prog-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
    </style>
  </defs>
  
  <rect x="1" y="2" width="848" height="65" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
  <rect x="1" y="2" width="6" height="6" fill="var(--primary)"/>
  <rect x="843" y="2" width="6" height="6" fill="var(--accent)"/>
  <rect x="1" y="61" width="6" height="6" fill="var(--accent)"/>
  <rect x="843" y="61" width="6" height="6" fill="var(--primary)"/>

  <!-- Label & Percentage Header -->
  <text x="14" y="19" fill="var(--title-front)" class="font-prog-lbl">■ V5.0 REPO &amp; PROFILE EVOLUTION COMPLETE</text>
  <rect x="776" y="7" width="60" height="15" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
  <text x="806" y="19" fill="var(--accent)" text-anchor="middle" class="font-prog-val">100%</text>

  <!-- Track & Segments -->
  <rect x="13" y="27" width="824" height="16" fill="none" stroke="var(--border-chassis)" stroke-width="1"/>
  <g id="segments">
    <rect x="14.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="39.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
