<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 14, 23, 0.85);
        --bg-panel: rgba(15, 23, 38, 0.82);
        --border-chassis: rgba(30, 41, 59, 0.85);
        --primary: #00C8D7;
        --accent: #A855F7;
        --tertiary: #FF0055;
        --title-front: #00C8D7;
        --title-mid: #006B74;
        --title-dark: #002B2F;
        --text-main: #F8F8F2;
        --text-dim: #94A3B8;
        --status: #00D26A;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: var(--primary); opacity: 1; } 50% { fill: var(--border-chassis); opacity: 0.3; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <rect x="1" y="4" width="848" height="28" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="2"/>
  <rect x="3" y="6" width="844" height="24" fill="none" stroke="var(--primary)" stroke-width="1.5" opacity="0.85"/>
  <rect x="1" y="4" width="5" height="5" fill="var(--primary)"/>
  <rect x="844" y="4" width="5" height="5" fill="var(--accent)"/>
  <!-- Downward Embracing Prongs (Flush x=1 and x=849) -->
  <line x1="1" y1="24" x2="1" y2="38" stroke="var(--primary)" stroke-width="2.5"/>
  <rect x="0" y="32" width="4" height="6" fill="var(--primary)"/>
  <line x1="849" y1="24" x2="849" y2="38" stroke="var(--primary)" stroke-width="2.5"/>
  <rect x="846" y="32" width="4" height="6" fill="var(--primary)"/>
  <circle cx="24" cy="18" r="4" fill="var(--primary)" class="led"/>
  <text x="36" y="22" fill="var(--primary)" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono"><tspan fill="var(--accent)">[//]</tspan> ╔═ CLI_COMMANDS.LIST // RUNTIME.SYS</text>
  <rect x="670" y="9" width="105" height="18" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
  <text x="722" y="22" fill="var(--primary)" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[OPEN_HUD]</text>
  <rect x="782" y="11" width="14" height="14" fill="var(--bg-panel)"/><text x="786" y="21" fill="var(--text-dim)" font-size="10" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="var(--bg-panel)"/><text x="803" y="22" fill="var(--text-dim)" font-size="10" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="var(--tertiary)"/><text x="822" y="22" fill="var(--text-main)" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>