<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 76" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #00e5b0;
        --accent: #e50035;
        --tertiary: #4400ff;
        --title-front: #00e5b0;
        --title-mid: #00674f;
        --title-dark: #00221a;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #00e5b0;
          --accent: #e50035;
          --tertiary: #4400ff;
          --title-front: #00e5b0;
          --title-mid: #00674f;
          --title-dark: #00221a;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #00a07b;
          --accent: #e50035;
          --tertiary: #4400ff;
          --title-front: #00a07b;
          --title-mid: #006049;
          --title-dark: #003024;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00e5b0));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

      @keyframes pulseLiveDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
      .live-dot { animation: pulseLiveDot 2.2s infinite ease-in-out; }
    </style>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
  </defs>

  <!-- Modern Card Background with rounded corners & top glow highlight -->
  <rect x="2" y="2" width="846" height="72" rx="14" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
  <path d="M 20 2 L 830 2" stroke="url(#footerGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Status Readout with Live Dot -->
  <g transform="translate(28, 28)">
    <circle cx="5" cy="-4" r="4" fill="var(--status)" class="live-dot"/>
    <text x="18" y="0" fill="var(--text-main)" font-size="13" font-weight="600" class="font-sans">SESSION_ONLINE // READY</text>
  </g>
  <text x="46" y="52" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">DEPLOYED TO GITHUB • MIT LICENSE • OPEN SOURCE</text>

  <!-- Right Navigation Pill Button -->
  <a href="#readme" class="btn-hover">
    <g transform="translate(706, 22)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="60" y="20" fill="var(--primary)" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">▲ НАВЕРХ</text>
    </g>
  </a>
</svg>