<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 102" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #00e5b0;
        --accent: #e50035;
        --tertiary: #06B6D4;
        --title-front: #00e5b0;
        --title-mid: #00674f;
        --title-dark: #00221a;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #00e5b0;
          --accent: #e50035;
          --tertiary: #06B6D4;
          --title-front: #00e5b0;
          --title-mid: #00674f;
          --title-dark: #00221a;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #00a07b;
          --accent: #e50035;
          --tertiary: #0891B2;
          --title-front: #00a07b;
          --title-mid: #006049;
          --title-dark: #003024;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00e5b0));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>
  <g id="metric-card-0">
    <rect x="2" y="3" width="201" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="18" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">CUSTOMIZATION</text>
    
    <text x="18" y="59" fill="var(--text-main)" font-size="22" font-weight="700" class="font-sans" letter-spacing="-0.5">4 STYLES</text>
    <text x="18" y="83" fill="var(--status)" font-size="10.5" font-weight="600" class="font-sans">↑ Vector, Pixel, Sketch...</text>
    <path d="M 147 81 Q 159 73 171 77 T 191 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="191" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
  <g id="metric-card-1">
    <rect x="217" y="3" width="201" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="233" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">THEME PALETTES</text>
    
    <text x="233" y="59" fill="var(--text-main)" font-size="18" font-weight="700" class="font-sans" letter-spacing="-0.5">13+ THEMES</text>
    <text x="233" y="83" fill="var(--status)" font-size="10.5" font-weight="600" class="font-sans">↑ Adaptive Dark/Light</text>
    <path d="M 362 81 Q 374 73 386 77 T 406 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="406" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
  <g id="metric-card-2">
    <rect x="432" y="3" width="201" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="448" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">COMPONENTS SUITE</text>
    
    <text x="448" y="59" fill="var(--text-main)" font-size="22" font-weight="700" class="font-sans" letter-spacing="-0.5">15 BLOCKS</text>
    <text x="448" y="83" fill="var(--status)" font-size="10.5" font-weight="600" class="font-sans">↑ Dossier &amp; Star...</text>
    <path d="M 577 81 Q 589 73 601 77 T 621 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="621" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
  <g id="metric-card-3">
    <rect x="647" y="3" width="201" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="663" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">RUNTIME DEPS</text>
    <g transform="translate(755, 15)">
      <rect x="0" y="0" width="81" height="18" rx="9" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="40" y="12" fill="var(--primary)" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">STD-LIB ONLY</text>
    </g>
    <text x="663" y="59" fill="var(--text-main)" font-size="26" font-weight="700" class="font-sans" letter-spacing="-0.5">0 EXT</text>
    
    <path d="M 792 81 Q 804 73 816 77 T 836 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="836" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
</svg>