    <line x1="216" y1="3" x2="224" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="411" y1="3" x2="419" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="419" y1="3" x2="419" y2="11" stroke="var(--primary)" stroke-width="2"/>
    <line x1="216" y1="87" x2="216" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="216" y1="95" x2="224" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="411" y1="95" x2="419" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="419" y1="87" x2="419" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <rect x="222" y="9" width="2" height="2" fill="var(--accent)"/>

