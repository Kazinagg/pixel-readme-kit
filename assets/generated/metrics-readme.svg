<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 98" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #0969DA;
        --accent: #8250DF;
        --tertiary: #CF222E;
        --title-front: #0969DA;
        --title-mid: #0550AE;
        --title-dark: #033D8B;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #1A7F37;
        --warning: #9A6700;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-mono-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
      .font-mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-mono-tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g id="metric-card-0">
    
    <rect x="1" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
    <line x1="1" y1="11" x2="1" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="3" x2="9" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="196" y1="3" x2="204" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="204" y1="3" x2="204" y2="11" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="87" x2="1" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="95" x2="9" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="196" y1="95" x2="204" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="204" y1="87" x2="204" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <rect x="7" y="9" width="2" height="2" fill="var(--accent)"/>

    <text x="15" y="25" fill="var(--text-dim)" class="font-mono-lbl">CACHE ACCELERATION</text>
    
    <text x="15" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">0.02s</text>
    <text x="15" y="79" fill="var(--status)" class="font-mono-sub">▲ 98% faster builds</text>
    
    <path d="M 150 81 L 160 75 L 170 83 L 180 71 L 190 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="190" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-1">
    
    <rect x="216" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
