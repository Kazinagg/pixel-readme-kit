    <rect x="337" y="13" width="70" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="372" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">100% PASS</text>
    <text x="230" y="57" fill="var(--title-front)" font-size="21" class="font-mono-val">99 / 99</text>
    
    
    <path d="M 365 81 L 375 75 L 385 83 L 395 71 L 405 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="405" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-2">
    
    <rect x="431" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
    <line x1="431" y1="11" x2="431" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="431" y1="3" x2="439" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="626" y1="3" x2="634" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="634" y1="3" x2="634" y2="11" stroke="var(--primary)" stroke-width="2"/>
    <line x1="431" y1="87" x2="431" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="431" y1="95" x2="439" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="626" y1="95" x2="634" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="634" y1="87" x2="634" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <rect x="437" y="9" width="2" height="2" fill="var(--accent)"/>

    <text x="445" y="25" fill="var(--text-dim)" class="font-mono-lbl">COMPONENTS SUITE</text>
    
    <text x="445" y="57" fill="var(--title-front)" font-size="18" class="font-mono-val">14 BLOCKS</text>
    <text x="445" y="79" fill="var(--status)" class="font-mono-sub">▲ +2 new in v5.0</text>
    
    <path d="M 580 81 L 590 75 L 600 83 L 610 71 L 620 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="620" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-3">
    
    <rect x="646" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
    <line x1="646" y1="11" x2="646" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="646" y1="3" x2="654" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="841" y1="3" x2="849" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="849" y1="3" x2="849" y2="11" stroke="var(--primary)" stroke-width="2"/>
    <line x1="646" y1="87" x2="646" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="646" y1="95" x2="654" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="841" y1="95" x2="849" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="849" y1="87" x2="849" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <rect x="652" y="9" width="2" height="2" fill="var(--accent)"/>

    <text x="660" y="25" fill="var(--text-dim)" class="font-mono-lbl">RUNTIME DEPS</text>
    <rect x="748" y="13" width="89" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="793" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">STD-LIB ONLY</text>
    <text x="660" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">0 EXT</text>
    
    
    <path d="M 795 81 L 805 75 L 815 83 L 825 71 L 835 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="835" cy="77" r="2" fill="var(--accent)"/>

  </g>
</svg>