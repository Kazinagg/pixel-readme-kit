<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #0969DA;
        --accent: #8250DF;
        --title-front: #0969DA;
        --title-mid: #0550AE;
        --title-dark: #033D8B;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #1A7F37;
        --warning: #9A6700;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Body Chassis -->
  <rect x="2" y="2" width="846" height="44" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.5"/><rect x="2" y="2" width="5" height="5" fill="var(--primary)"/><rect x="843" y="2" width="5" height="5" fill="var(--primary)"/><rect x="2" y="41" width="5" height="5" fill="var(--primary)"/><rect x="843" y="41" width="5" height="5" fill="var(--primary)"/>
  <!-- Badges & Accents -->
  <rect x="14" y="10" width="140" height="28" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="26" cy="24" r="3.5" fill="var(--primary)"/><text x="88" y="28" fill="var(--primary)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">NOTE // 0x01</text>
  <rect x="815" y="14" width="20" height="20" fill="var(--bg-panel)"/><text x="825" y="28" fill="var(--primary)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">ℹ</text>
  <!-- Text Content (Properly offset past badge edge) -->
  <text x="168" y="22" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">NOTE // РЕКОМЕНДАЦИЯ АРХИТЕКТУРЫ</text>
  <text x="168" y="36" fill="var(--accent)" font-size="11" class="font-mono">Подложка rgba(10, 14, 23, 0.82) защищает контраст</text>
</svg>