<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 26" width="135" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #0969DA;
        --accent: #8250DF;
        --title-front: #0969DA;
        --title-mid: #0550AE;
        --title-dark: #033D8B;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #1A7F37;
        --warning: #9A6700;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }

      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
    </style>
  </defs>
  <rect x="1" y="1" width="133" height="24" fill="var(--bg-glass)"/>
  <rect x="1" y="1" width="133" height="24" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/>
  <rect x="1" y="1" width="3" height="3" fill="var(--primary)"/>
  <rect x="131" y="1" width="3" height="3" fill="var(--primary)"/>
  <rect x="1" y="22" width="3" height="3" fill="var(--primary)"/>
  <rect x="131" y="22" width="3" height="3" fill="var(--primary)"/>
  <rect x="8" y="8" width="4" height="10" fill="var(--primary)"/>
  <text x="70" y="17" fill="var(--primary)" text-anchor="middle" class="chip-text">⚡ CLOSED_PILL</text>
</svg>