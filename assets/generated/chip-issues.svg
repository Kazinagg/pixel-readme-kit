<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 26" width="104" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F8FAFC;
        --bg-panel: #F1F5F9;
        --border-chassis: #E2E8F0;
        --primary: #1D4ED8;
        --accent: #6D28D9;
        --tertiary: #0891B2;
        --title-front: #1D4ED8;
        --title-mid: #1E40AF;
        --title-dark: #0F172A;
        --text-main: #0F172A;
        --text-dim: #64748B;
        --status: #16A34A;
        --warning: #D97706;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 18, 30, 0.85);
          --bg-panel: rgba(22, 27, 46, 0.80);
          --border-chassis: rgba(41, 46, 66, 0.85);
          --primary: #4F8BFF;
          --accent: #A855F7;
          --tertiary: #06B6D4;
          --title-front: #4F8BFF;
          --title-mid: #2563EB;
          --title-dark: #1E3A8A;
          --text-main: #F1F5F9;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #4F8BFF));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
      @keyframes breatheBeacon { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
      .breathe { animation: breatheBeacon 2s infinite ease-in-out; }
    </style>
  </defs>
  <rect x="1" y="1" width="102" height="24" fill="var(--bg-glass)"/>
  <rect x="1" y="1" width="102" height="24" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
  <path d="M 4 8 L 4 4 L 8 4" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <path d="M 100 8 L 100 4 L 96 4" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <path d="M 4 18 L 4 22 L 8 22" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <path d="M 100 18 L 100 22 L 96 22" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <circle cx="15" cy="13" r="3" fill="var(--primary)" class="breathe"/>
  <text x="57" y="17" fill="var(--primary)" text-anchor="middle" class="chip-text">● ISSUES</text>
</svg>