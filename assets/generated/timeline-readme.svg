<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 412" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 14, 23, 0.85);
        --bg-panel: rgba(15, 23, 38, 0.82);
        --border-chassis: rgba(30, 41, 59, 0.85);
        --primary: #00C8D7;
        --accent: #A855F7;
        --tertiary: #FF0055;
        --title-front: #00C8D7;
        --title-mid: #006B74;
        --title-dark: #002B2F;
        --text-main: #F8F8F2;
        --text-dim: #94A3B8;
        --status: #00D26A;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-time-date { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-time-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: bold; }
      .font-time-stat { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-time-desc { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: normal; }
    </style>
  </defs>
  <!-- Vertical Data PCB Bus -->
  <line x1="42" y1="14" x2="42" y2="368" stroke="var(--border-chassis)" stroke-width="2"/>
