<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 18, 30, 0.85);
        --bg-panel: rgba(22, 27, 46, 0.80);
        --border-chassis: rgba(41, 46, 66, 0.85);
        --primary: #4F8BFF;
        --accent: #A855F7;
        --tertiary: #06B6D4;
        --title-front: #4F8BFF;
        --title-mid: #2563EB;
        --title-dark: #1E3A8A;
        --text-main: #F1F5F9;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 18, 30, 0.85);
          --bg-panel: rgba(22, 27, 46, 0.80);
          --border-chassis: rgba(41, 46, 66, 0.85);
          --primary: #4F8BFF;
          --accent: #A855F7;
          --tertiary: #06B6D4;
          --title-front: #4F8BFF;
          --title-mid: #2563EB;
          --title-dark: #1E3A8A;
          --text-main: #F1F5F9;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #1D4ED8;
          --accent: #6D28D9;
          --tertiary: #0891B2;
          --title-front: #1D4ED8;
          --title-mid: #1E40AF;
          --title-dark: #0F172A;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #4F8BFF));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>

  
  <!-- TOKYO MINIMAL CHASSIS (Sharp 90°, 1px Swiss frame, bold accent top banner) -->
  <rect x="1" y="1" width="848" height="188" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.0"/>
  <rect x="1" y="1" width="848" height="5" fill="var(--primary)"/>
  <line x1="8" y1="188" x2="842" y2="188" stroke="var(--primary)" stroke-width="1.0" stroke-dasharray="4,4" opacity="0.35"/>
  <text x="832" y="180" fill="var(--text-dim)" font-size="8.5" text-anchor="end" class="font-mono">MINIMAL SPEC // VERIFIED</text>


  
  <!-- MINIMAL MATRIX AVATAR (Sharp 90°, Crosshair grid) -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="134" height="134" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.0"/>
    <circle cx="67" cy="48" r="22" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 28 98 C 28 76, 106 76, 106 98 Z" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.5"/>
    <circle cx="67" cy="48" r="6" fill="var(--accent)"/>
    <!-- Sharp status bar -->
    <rect x="8" y="108" width="118" height="18" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.0"/>
    <circle cx="20" cy="117" r="3" fill="var(--status)"/>
    <text x="30" y="120" fill="var(--status)" font-size="8.5" font-weight="600" class="font-mono">ACTIVE</text>
  </g>


  <!-- TOP BREADCRUMB -->
  <rect x="180" y="24" width="252" height="24" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
  <text x="192" y="40" fill="var(--primary)" font-size="11" font-weight="bold" class="font-mono">■ MINIMAL // SAN FRANCISCO // PST</text>

  <!-- BADGE AND STATUS PILLS (TOP RIGHT) -->
  <g transform="translate(647, 24)">
    <rect x="0" y="0" width="70" height="24" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="35" y="16" fill="var(--accent)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">STAFF</text>
    <rect x="78" y="0" width="105" height="24" fill="var(--bg-panel)" stroke="var(--status)" stroke-width="1"/>
    <circle cx="90" y="12" r="3" fill="var(--status)"/>
    <text x="136" y="16" fill="var(--status)" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">OPEN TO CHAT</text>
  </g>

  <!-- NAME TYPOGRAPHY -->
    <text x="180" y="78" fill="var(--title-front)" font-size="26" font-weight="700" letter-spacing="0.04em" class="font-mono">SARAH CHEN</text>

  <!-- ROLE PILL -->
  
  <g transform="translate(180, 116)">
    <rect x="0" y="0" width="218" height="26" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.0"/>
    <rect x="0" y="0" width="3" height="26" fill="var(--primary)"/>
    <text x="12" y="17" fill="var(--accent)" font-size="11.5" font-weight="600" class="font-mono">▶ STAFF SOFTWARE ENGINEER</text>
  </g>


  <!-- BIO SUMMARY -->
  <text x="182" y="166" fill="var(--text-main)" font-size="12" font-weight="normal" class="font-mono">Crafting elegant APIs, developer tools and clean architecture.</text>
</svg>