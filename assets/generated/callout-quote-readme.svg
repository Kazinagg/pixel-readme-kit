<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 42" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Background Glass (Flush left to connect with markdown quote border) -->
  <rect x="0" y="0" width="850" height="42" fill="rgba(20, 14, 6, 0.88)"/>
  <!-- Top Rail -->
  <line x1="0" y1="2" x2="838" y2="2" stroke="#F59E0B" stroke-width="2"/><line x1="838" y1="2" x2="849" y2="13" stroke="#F59E0B" stroke-width="2"/><line x1="849" y1="13" x2="849" y2="38" stroke="#F59E0B" stroke-width="2"/>
  <!-- Badge -->
  <polygon points="6 6, 12 6, 4 18, 0 18" fill="#F59E0B" opacity="0.6"/><polygon points="16 6, 22 6, 14 18, 8 18" fill="#F59E0B" opacity="0.6"/><polygon points="28 8, 165 8, 172 15, 172 27, 165 34, 28 34" fill="rgba(245, 158, 11, 0.18)" stroke="#F59E0B" stroke-width="1.5"/><text x="96" y="24" fill="#F59E0B" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">▲ NOTE // HAZARD</text>
  <!-- Title & Subtitle (Properly offset past badge edge) -->
  <text x="186" y="20" fill="#F8F8F2" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">РУКОВОДСТВО ПО СТИЛЮ</text>
  <text x="186" y="33" fill="#EA580C" font-size="8.5" class="font-mono">Где найти полные справочники и примеры</text>
  <!-- DASHED BOTTOM LINE: Bridges into live markdown text -->
  <line x1="0" y1="41" x2="845" y2="41" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.75"/>
  <polygon points="840 37, 848 37, 844 41" fill="#F59E0B"/>
</svg>