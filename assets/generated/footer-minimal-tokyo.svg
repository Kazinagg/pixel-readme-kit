<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 76" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Hairline Glass Footer Chassis -->
  <rect x="1" y="2" width="848" height="72" fill="rgba(15, 18, 30, 0.82)" stroke="rgba(41, 46, 66, 0.9)" stroke-width="1.5"/>
  <rect x="1" y="2" width="848" height="2" fill="#4F8BFF" opacity="0.9"/>
  <!-- Corner Hairline Hooks -->
  <path d="M 6 16 L 6 6 L 16 6" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 844 16 L 844 6 L 834 6" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 6 60 L 6 70 L 16 70" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 844 60 L 844 70 L 834 70" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>

  <!-- Top Micro-Header Line -->
  <text x="24" y="16" fill="#64748B" font-size="8.5" class="font-mono">// TERMINAL_SESSION // KERNEL v2.2</text>
  <line x1="220" y1="13" x2="630" y2="13" stroke="rgba(41, 46, 66, 0.85)" stroke-width="1"/>
  <text x="826" y="16" fill="#64748B" font-size="8.5" text-anchor="end" class="font-mono">END_OF_PAGE</text>

  <!-- Main Status Row -->
  <circle cx="28" cy="38" r="4" fill="#4F8BFF"/>
  <circle cx="28" cy="38" r="7" fill="none" stroke="#4F8BFF" stroke-width="1" opacity="0.4"/>
  <text x="44" y="42" fill="#F1F5F9" font-size="11.5" font-weight="bold" class="font-mono">STATUS: <tspan fill="#4F8BFF">RUNTIME_COMPLIANT // UTF8</tspan></text>

  <!-- Secondary Telemetry Line -->
  <text x="24" y="62" fill="#64748B" font-size="8.5" class="font-mono">LATENCY: 0.04ms • ALL SYSTEMS GREEN • MIT LICENSE 2026</text>

  <!-- Center Spectrum Waveform -->
  <g transform="translate(405, 32)">
    <rect x="0" y="4" width="3" height="12" fill="#4F8BFF" opacity="0.6"/>
    <rect x="6" y="1" width="3" height="18" fill="#A855F7" opacity="0.8"/>
    <rect x="12" y="7" width="3" height="9" fill="#4F8BFF" opacity="0.5"/>
    <rect x="18" y="0" width="3" height="20" fill="#A855F7" opacity="1"/>
    <rect x="24" y="5" width="3" height="11" fill="#4F8BFF" opacity="0.7"/>
    <rect x="30" y="2" width="3" height="16" fill="#A855F7" opacity="0.8"/>
    <rect x="36" y="6" width="3" height="10" fill="#4F8BFF" opacity="0.5"/>
  </g>

  <!-- Right Clean Return Button -->
  <rect x="670" y="24" width="160" height="34" fill="rgba(79, 139, 255, 0.12)" stroke="#4F8BFF" stroke-width="1"/>
  <text x="750" y="45" fill="#4F8BFF" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">▲ RETURN TOP</text>
</svg>