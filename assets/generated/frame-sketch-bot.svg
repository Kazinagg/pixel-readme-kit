<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 28" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(18, 18, 18, 0.95);
        --bg-panel: rgba(28, 28, 28, 0.90);
        --border-chassis: #E0E0E0;
        --primary: #A78BFA;
        --accent: #6EE7B7;
        --tertiary: #FDE047;
        --title-front: #F3F4F6;
        --title-mid: #E0E0E0;
        --title-dark: #A78BFA;
        --text-main: #F3F4F6;
        --text-dim: #9CA3AF;
        --status: #6EE7B7;
        --warning: #FDE047;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(18, 18, 18, 0.95);
          --bg-panel: rgba(28, 28, 28, 0.90);
          --border-chassis: #E0E0E0;
          --primary: #A78BFA;
          --accent: #6EE7B7;
          --tertiary: #FDE047;
          --title-front: #F3F4F6;
          --title-mid: #E0E0E0;
          --title-dark: #A78BFA;
          --text-main: #F3F4F6;
          --text-dim: #9CA3AF;
          --status: #6EE7B7;
          --warning: #FDE047;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FDFDFD;
          --bg-panel: #F4F4F5;
          --border-chassis: #1F2937;
          --primary: #4F46E5;
          --accent: #059669;
          --tertiary: #D97706;
          --title-front: #111827;
          --title-mid: #374151;
          --title-dark: #4F46E5;
          --text-main: #111827;
          --text-dim: #4B5563;
          --status: #059669;
          --warning: #D97706;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #A78BFA));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sketch { font-family: 'Virgil', 'Architects Daughter', 'Comic Shanns', 'Kalam', 'Chalkboard SE', 'Comic Sans MS', 'Casual', cursive, sans-serif; }
    .font-sketch-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sketch-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .sketch-hover:hover { opacity: 0.85; transform: scale(1.01); }

    </style>
    <pattern id="frameSketchBot-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--primary)" stroke-width="1.3" opacity="0.45" />
    </pattern>
    <pattern id="frameSketchBot-crosshatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
      <line x1="0" y1="0" x2="12" y2="0" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <pattern id="frameSketchBot-hatch-accent" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--accent)" stroke-width="1.3" opacity="0.5" />
    </pattern>
    <linearGradient id="frameSketchBot-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Sketch Bottom Cap -->
  <rect x="2" y="2" width="846" height="25" rx="6" fill="var(--bg-glass)" fill-opacity="1.0" />
    <path d="M -0.33 3.14 Q 424.32 2.04 851.56 3.04" stroke="var(--border-chassis)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M -0.11 1.35 Q 425.0 1.43 851.81 1.27" stroke="var(--border-chassis)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 847.05 -1.48 Q 847.15 14.37 847.86 30.33" stroke="var(--border-chassis)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 847.6 -1.02 Q 848.14 14.07 848.25 30.63" stroke="var(--border-chassis)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 851.79 25.87 Q 426.1 25.21 -0.6 27.88" stroke="var(--border-chassis)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 850.08 26.46 Q 423.58 27.89 -0.32 26.14" stroke="var(--border-chassis)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 2.22 30.69 Q 3.12 12.73 0.91 -1.61" stroke="var(--border-chassis)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 2.53 30.91 Q 0.57 15.38 1.49 -1.13" stroke="var(--border-chassis)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 0.52 1.0 Q 426.21 -0.68 848.24 0.72" stroke="var(--border-chassis)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 0.98 1.36 Q 426.37 1.8 848.75 1.13" stroke="var(--border-chassis)" stroke-width="1.27" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Center Status / Return Label -->
  <g>
    <rect x="345" y="4" width="160" height="20" rx="6" fill="var(--bg-panel)" fill-opacity="1.0" />
    <path d="M 341.37 3.84 Q 423.59 3.31 508.71 5.18" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 341.85 4.23 Q 425.59 4.02 508.93 3.39" stroke="var(--accent)" stroke-width="0.94" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 506.11 0.18 Q 503.46 13.17 506.19 26.26" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 504.33 0.71 Q 505.69 14.12 504.39 26.77" stroke="var(--accent)" stroke-width="0.94" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 507.72 24.2 Q 423.54 23.25 342.28 24.76" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 508.14 24.52 Q 425.63 24.06 342.59 23.05" stroke="var(--accent)" stroke-width="0.94" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 345.28 27.75 Q 343.52 13.23 344.7 1.18" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 345.58 26.04 Q 345.64 14.07 345.12 1.5" stroke="var(--accent)" stroke-width="0.94" stroke-linecap="round" fill="none" opacity="0.75" />
    <text x="425" y="17" fill="var(--primary)" font-size="10" font-weight="600" text-anchor="middle" class="font-sketch">▲ RETURN TO TOP</text>
  </g>
</svg>