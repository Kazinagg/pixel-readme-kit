<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 76" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #0969DA;
        --accent: #8250DF;
        --title-front: #0969DA;
        --title-mid: #0550AE;
        --title-dark: #033D8B;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #1A7F37;
        --warning: #9A6700;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: var(--primary); opacity: 1; } 50% { fill: #1E293B; opacity: 0.3; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <!-- Cyberpunk Heavy Chassis -->
  <rect x="1" y="2" width="848" height="72" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="2"/>
  <rect x="4" y="5" width="842" height="66" fill="none" stroke="var(--primary)" stroke-width="1" opacity="0.6"/>

  <!-- 4 Corner Pixel Brackets 6x6 -->
  <rect x="1" y="2" width="6" height="6" fill="var(--primary)"/>
  <rect x="843" y="2" width="6" height="6" fill="var(--primary)"/>
  <rect x="1" y="68" width="6" height="6" fill="var(--accent)"/>
  <rect x="843" y="68" width="6" height="6" fill="var(--accent)"/>

  <!-- Top Micro-Rail -->
  <line x1="12" y1="9" x2="838" y2="9" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
  <text x="14" y="16" fill="var(--accent)" font-size="11" font-weight="bold" class="font-mono">[SYS_EOF: 0x00FF]</text>
  <text x="836" y="16" fill="var(--accent)" font-size="11" font-weight="bold" text-anchor="end" class="font-mono">// BUS_SPEED: 64Gbps //</text>

  <!-- Left Main Status Readout -->
  <circle cx="26" cy="35" r="4.5" fill="var(--primary)" class="led"/>
  <circle cx="26" cy="35" r="1.5" fill="#FFFFFF"/>
  <rect x="38" y="26" width="76" height="18" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
  <text x="76" y="38" fill="var(--primary)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">SYS_STATUS</text>
  <text x="124" y="40" fill="var(--primary)" font-size="12" font-weight="bold" class="font-mono">LIBRARY_RUNTIME_ACTIVE // STANDBY</text>

  <!-- Secondary Diagnostics Sub-line -->
  <text x="24" y="61" fill="var(--text-dim)" font-size="11" class="font-mono"><tspan fill="var(--accent)">RUNTIME:</tspan> BUFFER_CLEARED <tspan fill="rgba(148, 163, 184, 0.4)">|</tspan> <tspan fill="var(--accent)">PACKET_LOSS:</tspan> 0.00% <tspan fill="rgba(148, 163, 184, 0.4)">|</tspan> <tspan fill="var(--accent)">LINK_QUALITY:</tspan> 100%_LOCKED</text>

  <!-- Center PCB Pulse / Mini Matrix -->
  <g transform="translate(390, 30)">
    <line x1="0" y1="6" x2="70" y2="6" stroke="var(--border-chassis)" stroke-width="2"/>
    <line x1="0" y1="6" x2="35" y2="6" stroke="var(--primary)" stroke-width="2"/>
    <circle cx="0" cy="6" r="3" fill="var(--primary)"/>
    <circle cx="70" cy="6" r="3" fill="var(--primary)"/>
    <rect x="25" y="0" width="20" height="12" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1"/>
    <text x="35" y="9" fill="var(--primary)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">EOF</text>
  </g>

  <!-- Right Return To Top Button -->
  <g transform="translate(655, 22)" class="btn-hover">
    <rect x="0" y="0" width="180" height="36" fill="rgba(0, 200, 215, 0.16)" stroke="var(--primary)" stroke-width="1.5"/>
    <rect x="0" y="0" width="3" height="3" fill="var(--primary)"/>
    <rect x="177" y="0" width="3" height="3" fill="var(--primary)"/>
    <rect x="0" y="33" width="3" height="3" fill="var(--primary)"/>
    <rect x="177" y="33" width="3" height="3" fill="var(--primary)"/>
    <text x="90" y="21" fill="var(--primary)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">▲ RETURN TO TOP</text>
    <text x="90" y="31" fill="var(--text-dim)" font-size="11" text-anchor="middle" class="font-mono">[ CLICK TO RETURN ]</text>
  </g>

  <!-- Bottom Grounding Notch -->
  <line x1="20" y1="73" x2="830" y2="73" stroke="var(--primary)" stroke-width="1" opacity="0.4"/>
  <polygon points="400 73, 450 73, 443 75, 407 75" fill="var(--primary)"/>
</svg>