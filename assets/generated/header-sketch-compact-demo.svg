<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 80" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(24, 24, 27, 0.94);
        --bg-panel: rgba(39, 39, 42, 0.90);
        --border-chassis: #FAFAFA;
        --primary: #38BDF8;
        --accent: #F87171;
        --tertiary: #FBBF24;
        --title-front: #FAFAFA;
        --title-mid: #E4E4E7;
        --title-dark: #38BDF8;
        --text-main: #FAFAFA;
        --text-dim: #A1A1AA;
        --status: #34D399;
        --warning: #FBBF24;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(24, 24, 27, 0.94);
          --bg-panel: rgba(39, 39, 42, 0.90);
          --border-chassis: #FAFAFA;
          --primary: #38BDF8;
          --accent: #F87171;
          --tertiary: #FBBF24;
          --title-front: #FAFAFA;
          --title-mid: #E4E4E7;
          --title-dark: #38BDF8;
          --text-main: #FAFAFA;
          --text-dim: #A1A1AA;
          --status: #34D399;
          --warning: #FBBF24;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFFFF;
          --bg-panel: #F8FAFC;
          --border-chassis: #18181B;
          --primary: #2563EB;
          --accent: #DC2626;
          --tertiary: #D97706;
          --title-front: #0F172A;
          --title-mid: #1E293B;
          --title-dark: #2563EB;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #DC2626;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sketch { font-family: 'Virgil', 'Architects Daughter', 'Comic Shanns', 'Kalam', 'Chalkboard SE', 'Comic Sans MS', 'Casual', cursive, sans-serif; }
    .font-sketch-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sketch-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .sketch-hover:hover { opacity: 0.85; transform: scale(1.01); }

    </style>
    <pattern id="compactSketch-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--primary)" stroke-width="1.3" opacity="0.45" />
    </pattern>
    <pattern id="compactSketch-crosshatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
      <line x1="0" y1="0" x2="12" y2="0" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <pattern id="compactSketch-hatch-accent" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--accent)" stroke-width="1.3" opacity="0.5" />
    </pattern>
    <linearGradient id="compactSketch-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Sketch Rough Card Chassis -->
  <rect x="4" y="4" width="842" height="72" rx="6" fill="var(--bg-glass)" fill-opacity="1.0" />
    <path d="M 0.26 3.74 Q 425.81 5.53 847.98 3.45" stroke="var(--border-chassis)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 0.77 4.15 Q 423.81 5.12 848.54 3.92" stroke="var(--border-chassis)" stroke-width="1.19" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 845.38 0.85 Q 847.76 38.87 846.11 79.59" stroke="var(--border-chassis)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 845.86 1.24 Q 846.94 40.37 846.45 79.83" stroke="var(--border-chassis)" stroke-width="1.19" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 850.05 75.12 Q 426.75 74.86 1.83 74.91" stroke="var(--border-chassis)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 848.28 75.66 Q 425.94 76.37 0.11 75.49" stroke="var(--border-chassis)" stroke-width="1.19" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 4.83 77.9 Q 4.66 41.37 3.59 1.07" stroke="var(--border-chassis)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 3.1 78.48 Q 2.94 41.25 4.04 1.42" stroke="var(--border-chassis)" stroke-width="1.19" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Doodle Action Dots -->
  <circle cx="18" cy="18" r="3.5" fill="var(--primary)" opacity="0.8"/>
  <circle cx="28" cy="18" r="3.5" fill="var(--accent)" opacity="0.8"/>
  <circle cx="38" cy="18" r="3.5" fill="var(--tertiary)" opacity="0.8"/>

  <!-- Hand-Drawn Typography -->
  <text x="32" y="36" font-size="20" font-weight="700" fill="var(--primary)" class="font-sketch">EXCALIDRAW DRAFT</text>
  <path d="M 32.68 40.92 Q 135.32 42.47 239.86 41.1" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 32.88 41.46 Q 135.15 41.13 238.26 41.61" stroke="var(--accent)" stroke-width="1.27" stroke-linecap="round" fill="none" opacity="0.75" />
  <text x="32" y="62" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sketch">✏️ LIGHTWEIGHT MARKER ON WHITEBOARD</text>

  <!-- Sketch Tag Badge -->
  <g>
    <rect x="700" y="24" width="126" height="28" rx="6" fill="var(--bg-panel)" fill-opacity="1.0" />
    <path d="M 695.9 23.37 Q 762.22 23.93 828.61 24.09" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 696.48 23.86 Q 763.08 23.51 829.05 24.43" stroke="var(--accent)" stroke-width="1.02" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 826.01 21.49 Q 824.28 36.99 825.64 55.11" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 826.37 21.75 Q 826.84 38.27 826.07 55.45" stroke="var(--accent)" stroke-width="1.02" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 829.58 53.05 Q 761.49 51.2 696.36 51.84" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 829.82 51.28 Q 763.67 52.1 696.85 52.23" stroke="var(--accent)" stroke-width="1.02" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 699.36 54.83 Q 699.28 37.99 699.23 20.71" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="1.0" />
    <path d="M 699.85 55.23 Q 700.03 37.46 699.75 21.13" stroke="var(--accent)" stroke-width="1.02" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 713.5,33.0 L 716.4,41.8 L 709.8,36.1 L 718.7,36.8 L 710.7,41.1 L 713.7,33.6" stroke="var(--tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="var(--tertiary)" />
    <text x="769" y="42" fill="var(--text-main)" font-size="11" font-weight="600" text-anchor="middle" class="font-sketch">SYSTEM_ACTIVE</text>
  </g>
</svg>