<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

      @keyframes pulseLiveDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .live-dot { animation: pulseLiveDot 2.2s infinite ease-in-out; }
    </style>
    <linearGradient id="modernHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
  </defs>

  <!-- Modern Card Background with rounded corners & top gradient highlight -->
  <rect x="2" y="2" width="846" height="196" rx="16" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
  <path d="M 24 2 L 826 2" stroke="url(#modernHeaderGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Clean Vector Typography Header -->
  <text x="36" y="68" font-size="32" font-weight="700" fill="url(#modernHeaderGrad)" class="font-sans" letter-spacing="-0.5">MODERN VECTOR SUITE</text>
  
  <!-- Subtitle with Pulse Live Dot -->
  <g transform="translate(36, 98)">
    <circle cx="5" cy="-4" r="4" fill="var(--status)" class="live-dot"/>
    <text x="18" y="0" fill="var(--text-dim)" font-size="13" font-weight="500" class="font-sans">CLEAN SAAS AESTHETICS // LINEAR &amp; VERCEL INPIRED</text>
  </g>

  <!-- Modern Specs Pills -->
    <g transform="translate(36, 132)">
      <rect x="0" y="0" width="137" height="28" rx="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="14" y="18" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">BORDER:</text>
      <text x="60" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">1PX SUBTLE</text>
    </g>
    <g transform="translate(185, 132)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="14" y="18" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">TYPE:</text>
      <text x="47" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">VECTOR SANS</text>
    </g>
    <g transform="translate(327, 132)">
      <rect x="0" y="0" width="144" height="28" rx="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="14" y="18" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">RADII:</text>
      <text x="54" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">SMOOTH RX-14</text>
    </g>

  <!-- Modern Upper-Right Tag Badge -->
  <g transform="translate(680, 32)">
    <rect x="0" y="0" width="138" height="32" rx="16" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <circle cx="16" cy="16" r="3.5" fill="var(--primary)"/>
    <text x="75" y="20" fill="var(--text-main)" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">SYSTEM_ACTIVE</text>
  </g>
</svg>