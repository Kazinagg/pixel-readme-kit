<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #39FF14; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>

  
  <rect x="1" y="4" width="848" height="28" fill="rgba(6, 18, 12, 0.82)" stroke="rgba(20, 45, 25, 0.85)" stroke-width="2"/>
  <rect x="3" y="6" width="844" height="24" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.85"/>
  <rect x="1" y="4" width="5" height="5" fill="#39FF14"/>
  <rect x="844" y="4" width="5" height="5" fill="#39FF14"/>
        
  
  <!-- DOWNWARD EMBRACING PRONGS (FLUSH TO EDGES x=1..849) -->
  <line x1="1" y1="24" x2="1" y2="38" stroke="#39FF14" stroke-width="2.5"/>
  <rect x="0" y="32" width="4" height="6" fill="#39FF14"/>
  <line x1="849" y1="24" x2="849" y2="38" stroke="#39FF14" stroke-width="2.5"/>
  <rect x="846" y="32" width="4" height="6" fill="#39FF14"/>
        

  <!-- Status LED -->
  <circle cx="24" cy="18" r="4" fill="#39FF14" class="led"/>

  <!-- Title Text -->
  <text x="36" y="22" fill="#39FF14" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ INVENTORY // HOLOGRAPHIC_CHIP_VARIANTS.SYS
  </text>

  <!-- Right Status Tag -->
  <rect x="670" y="9" width="105" height="18" fill="rgba(12, 28, 18, 0.78)" stroke="#39FF14" stroke-width="1"/>
  <text x="723" y="22" fill="#39FF14" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[CHIPS_V2]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="782" y="11" width="14" height="14" fill="rgba(20, 45, 25, 0.85)"/>
  <text x="786" y="21" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="rgba(20, 45, 25, 0.85)"/>
  <text x="803" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="#FF0055"/>
  <text x="822" y="22" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>