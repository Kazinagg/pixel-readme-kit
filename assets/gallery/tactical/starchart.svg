<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #92400E;
        --title-dark: #451A03;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #B45309;
          --accent: #C2410C;
          --tertiary: #B91C1C;
          --title-front: #B45309;
          --title-mid: #78350F;
          --title-dark: #451A03;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
    <linearGradient id="grad-star-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  
  <polygon points="12 1, 838 1, 849 12, 849 218, 838 229, 12 229, 1 218, 1 12"
           fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.5"/>
  <rect x="1" y="1" width="12" height="12" fill="var(--primary)"/>
  <rect x="837" y="217" width="12" height="12" fill="var(--accent)"/>
  <line x1="20" y1="1" x2="60" y2="1" stroke="var(--primary)" stroke-width="2"/>


  <!-- HEADER BAR -->
  <rect x="20" y="16" width="436" height="28" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
  <rect x="20" y="16" width="4" height="28" fill="var(--primary)"/>
  <text x="32" y="35" fill="var(--primary)" font-size="11.5" font-weight="bold" letter-spacing="0.5px" class="font-mono">★ TELEMETRY // STAR GROWTH</text>
  <text x="235" y="35" fill="var(--text-dim)" font-size="11" class="font-mono">// Kazinagg/pixel-readme-kit</text>

  <!-- STATS BADGES -->
  <g transform="translate(608, 16)">
    <rect x="0" y="0" width="90" height="28" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
    <text x="45" y="19" fill="var(--primary)" font-size="12" font-weight="bold" text-anchor="middle" class="font-mono">★ 1280</text>
    <rect x="98" y="0" width="124" height="28" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="160" y="19" fill="var(--accent)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">+340 this month</text>
  </g>

  <!-- GRID & AXES -->
  <line x1="75" y1="185.0" x2="800" y2="185.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><line x1="75" y1="146.7" x2="800" y2="146.7" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><line x1="75" y1="108.3" x2="800" y2="108.3" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/><line x1="75" y1="70.0" x2="800" y2="70.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="65" y="189.0" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">0</text><text x="65" y="150.7" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">550</text><text x="65" y="112.3" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">1.1k</text><text x="65" y="74.0" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">1.6k</text>
  <line x1="75.0" y1="70" x2="75.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/><line x1="220.0" y1="70" x2="220.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/><line x1="365.0" y1="70" x2="365.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/><line x1="510.0" y1="70" x2="510.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/><line x1="655.0" y1="70" x2="655.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/><line x1="800.0" y1="70" x2="800.0" y2="185" stroke="var(--border-chassis)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
  <text x="75.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">M-5</text><text x="220.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">M-4</text><text x="365.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">M-3</text><text x="510.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">M-2</text><text x="655.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">M-1</text><text x="800.0" y="203" fill="var(--text-dim)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">NOW</text>

  <!-- CHART AREA & LINE -->
  <path d="M 75.0 185 L 75.0 184.0 L 220.0 180.5 L 365.0 171.8 L 510.0 151.5 L 655.0 118.8 L 800.0 70.0 L 800.0 185 Z" fill="url(#grad-star-area)" shape-rendering="geometricPrecision"/>
  <path d="M 75.0,184.0 L 220.0,180.5 L 365.0,171.8 L 510.0,151.5 L 655.0,118.8 L 800.0,70.0" fill="none" stroke="var(--primary)" stroke-width="2.5" shape-rendering="geometricPrecision"/>

  <!-- DATA VERTICES -->
  <circle cx="75.0" cy="184.0" r="3.5" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.8"/><circle cx="220.0" cy="180.5" r="3.5" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.8"/><circle cx="365.0" cy="171.8" r="3.5" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.8"/><circle cx="510.0" cy="151.5" r="3.5" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.8"/><circle cx="655.0" cy="118.8" r="3.5" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.8"/>
    <!-- Peak Milestone Marker -->
    <circle cx="800.0" cy="70.0" r="8" fill="var(--accent)" opacity="0.25"/>
    <circle cx="800.0" cy="70.0" r="5.5" fill="var(--bg-glass)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="800.0" cy="70.0" r="2.5" fill="var(--primary)"/>
    <!-- Peak Callout Tag -->
    <g transform="translate(760.0, 40.0)">
      <rect x="0" y="0" width="76" height="22" rx="3" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="38" y="15" fill="var(--accent)" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">★ 1280</text>
    </g>
</svg>