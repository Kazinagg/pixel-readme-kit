<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 68" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #92400E;
        --title-dark: #451A03;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #B45309;
          --accent: #C2410C;
          --tertiary: #B91C1C;
          --title-front: #B45309;
          --title-mid: #78350F;
          --title-dark: #451A03;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-prog-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-prog-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; font-weight: 900; }
      .font-prog-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
    </style>
  </defs>
  
  <polygon points="1,2 849,2 849,58 840,67 10,67 1,58" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
  <polygon points="1,2 14,2 1,15" fill="var(--primary)"/>
  <polygon points="849,2 836,2 849,15" fill="var(--accent)"/>

  <!-- Label & Percentage Header -->
  <text x="14" y="19" fill="var(--title-front)" class="font-prog-lbl">■ SPRINT COMPLETION</text>
  <rect x="776" y="7" width="60" height="15" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
  <text x="806" y="19" fill="var(--accent)" text-anchor="middle" class="font-prog-val">85%</text>

  <!-- Track & Segments -->
  <rect x="13" y="27" width="824" height="16" fill="none" stroke="var(--border-chassis)" stroke-width="1"/>
  <g id="segments">
    <rect x="14.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="39.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="65.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="91.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="117.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="142.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="168.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="194.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="220.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="245.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="271.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="297.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="323.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="348.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="374.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="400.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="426.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="451.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="477.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="503.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="529.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="554.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="580.5" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="606.2" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="632.0" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="657.8" y="28" width="23.8" height="14" fill="var(--primary)" fill-opacity="1.0"/>
    <rect x="683.5" y="28" width="23.8" height="14" fill="var(--accent)" fill-opacity="1.0"/>
    <rect x="709.2" y="28" width="23.8" height="14" fill="var(--border-chassis)" fill-opacity="0.2"/>
    <rect x="735.0" y="28" width="23.8" height="14" fill="var(--border-chassis)" fill-opacity="0.2"/>
    <rect x="760.8" y="28" width="23.8" height="14" fill="var(--border-chassis)" fill-opacity="0.2"/>
    <rect x="786.5" y="28" width="23.8" height="14" fill="var(--border-chassis)" fill-opacity="0.2"/>
    <rect x="812.2" y="28" width="23.8" height="14" fill="var(--border-chassis)" fill-opacity="0.2"/>
  </g>

  <!-- Subtext & Milestone Ticks -->
  <text x="14" y="56" fill="var(--text-dim)" class="font-prog-sub">34 OF 40 TASKS COMPLETED (85%)</text>
  <text x="836" y="56" fill="var(--text-dim)" text-anchor="end" class="font-prog-sub">0% ── 50% ── 100%</text>
</svg>