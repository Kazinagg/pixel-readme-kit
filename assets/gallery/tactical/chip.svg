<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 219 26" width="219" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #92400E;
        --title-dark: #451A03;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #B45309;
          --accent: #C2410C;
          --tertiary: #B91C1C;
          --title-front: #B45309;
          --title-mid: #78350F;
          --title-dark: #451A03;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
    </style>
  </defs>
  <polygon points="7 1, 183 1, 169 25, 7 25, 1 19, 1 7" fill="var(--bg-glass)"/>
  <polygon points="7 1, 183 1, 169 25, 7 25, 1 19, 1 7" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/>
  <polygon points="8 13, 13 9, 13 17" fill="var(--primary)"/>
  <polygon points="188 1, 192 1, 178 25, 174 25" fill="var(--primary)" opacity="0.9"/>
  <polygon points="197 3, 200.5 3, 186.5 23, 183 23" fill="var(--primary)" opacity="0.65"/>
  <polygon points="205 6, 208 6, 194 20, 191 20" fill="var(--primary)" opacity="0.4"/>
  <polygon points="213 9, 215 9, 201 17, 199 17" fill="var(--primary)" opacity="0.2"/>
  <text x="88" y="17" fill="var(--primary)" text-anchor="middle" class="chip-text">STATUS: 200 OK</text>
</svg>