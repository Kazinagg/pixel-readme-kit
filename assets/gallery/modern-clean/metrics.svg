<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 102" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>
  <g id="metric-card-0">
    <rect x="2" y="3" width="272" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="18" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">CORE UPTIME</text>
    <g transform="translate(201, 15)">
      <rect x="0" y="0" width="61" height="18" rx="9" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="30" y="12" fill="var(--primary)" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">NOMINAL</text>
    </g>
    <text x="18" y="59" fill="var(--text-main)" font-size="26" font-weight="700" class="font-sans" letter-spacing="-0.5">99.98%</text>
    <text x="18" y="83" fill="var(--text-dim)" font-size="10.5" font-weight="600" class="font-sans">+0.02%</text>
    <path d="M 218 81 Q 230 73 242 77 T 262 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="262" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
  <g id="metric-card-1">
    <rect x="288" y="3" width="272" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="304" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">LATENCY</text>
    <g transform="translate(487, 15)">
      <rect x="0" y="0" width="61" height="18" rx="9" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="30" y="12" fill="var(--primary)" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">OPTIMAL</text>
    </g>
    <text x="304" y="59" fill="var(--text-main)" font-size="26" font-weight="700" class="font-sans" letter-spacing="-0.5">12ms</text>
    <text x="304" y="83" fill="var(--text-dim)" font-size="10.5" font-weight="600" class="font-sans">-3ms</text>
    <path d="M 504 81 Q 516 73 528 77 T 548 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="548" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
  <g id="metric-card-2">
    <rect x="574" y="3" width="272" height="96" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <text x="590" y="28" fill="var(--text-dim)" font-size="11" font-weight="600" class="font-sans">BUFFER</text>
    <g transform="translate(781, 15)">
      <rect x="0" y="0" width="53" height="18" rx="9" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
      <text x="26" y="12" fill="var(--primary)" font-size="9" font-weight="600" text-anchor="middle" class="font-sans">STABLE</text>
    </g>
    <text x="590" y="59" fill="var(--text-main)" font-size="26" font-weight="700" class="font-sans" letter-spacing="-0.5">256MB</text>
    <text x="590" y="83" fill="var(--text-dim)" font-size="10.5" font-weight="600" class="font-sans">+14MB</text>
    <path d="M 790 81 Q 802 73 814 77 T 834 71" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <circle cx="834" cy="71" r="2.5" fill="var(--accent)"/>
  </g>
</svg>