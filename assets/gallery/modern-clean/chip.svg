<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 26" width="110" height="26">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>

  <!-- Modern Dual-Segment Pill Badge -->
  <rect x="1" y="1" width="108" height="24" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
  <path d="M 1 13 Q 1 1 13 1 L 57 1 L 57 25 L 13 25 Q 1 25 1 13 Z" fill="var(--bg-panel)"/>
  <line x1="57" y1="1" x2="57" y2="25" stroke="var(--border-chassis)" stroke-width="1"/>

  <!-- Label & Value -->
  <text x="29" y="17" fill="var(--text-dim)" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">STATUS</text>
  <text x="83" y="17" fill="var(--primary)" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">200 OK</text>
</svg>