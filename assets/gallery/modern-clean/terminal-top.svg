<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 36" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>

  <!-- Modern Top Cap: Rounded Top (rx=10) & Flat Bottom (Flush to table) -->
  <path d="M 1 36 L 1 10 Q 1 1 10 1 L 840 1 Q 849 1 849 10 L 849 36 Z"
        fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>
  <line x1="1" y1="36" x2="849" y2="36" stroke="var(--border-chassis)" stroke-width="1"/>

  <!-- macOS / SaaS Window Traffic Lights -->
  <circle cx="20" cy="18" r="4" fill="#EF4444" opacity="0.85"/>
  <circle cx="34" cy="18" r="4" fill="#F59E0B" opacity="0.85"/>
  <circle cx="48" cy="18" r="4" fill="#10B981" opacity="0.85"/>

  <!-- Clean Title -->
  <text x="68" y="22" fill="var(--primary)" font-size="12" font-weight="700" class="font-mono">❯ <tspan fill="var(--text-main)">BASH // PRODUCTION_DEPLOY</tspan> <tspan fill="var(--accent)">_</tspan></text>

  <!-- Modern Pill Tag Button -->
  <g transform="translate(750, 7)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="40" y="15" fill="var(--primary)" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">ONLINE</text>
  </g>
</svg>