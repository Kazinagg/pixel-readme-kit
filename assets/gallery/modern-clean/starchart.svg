<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
        <linearGradient id="modern-starchart-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
    <linearGradient id="modern-starchart-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.6" />
      <stop offset="100%" stop-color="var(--border-chassis)" stop-opacity="0.3" />
    </linearGradient>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
    <linearGradient id="modern-star-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- MODERN CHASSIS -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="var(--bg-glass)" stroke="url(#modern-starchart-border-grad)" stroke-width="1.2"/>
  <path d="M 16 2 L 834 2" stroke="url(#modern-starchart-accent-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- HEADER -->
  <g transform="translate(20, 18)">
    <circle cx="8" cy="14" r="3.5" fill="var(--status)"/>
    <text x="18" y="18" fill="var(--text-main)" font-size="12" font-weight="700" letter-spacing="0.03em" class="font-sans">TELEMETRY // STAR GROWTH</text>
    <text x="198" y="18" fill="var(--text-dim)" font-size="11" class="font-mono">/ Kazinagg/pixel-readme-kit</text>
  </g>

  <!-- STATS PILLS -->
  <g transform="translate(634, 18)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1"/>
    <text x="43" y="16" fill="var(--primary)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 1280</text>
    <rect x="94" y="0" width="102" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="145" y="16" fill="var(--accent)" font-size="10.5" font-weight="600" text-anchor="middle" class="font-sans">+340 this month</text>
  </g>

  <!-- GRID & AXES -->
  <line x1="65" y1="186.0" x2="810" y2="186.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="146.7" x2="810" y2="146.7" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="107.3" x2="810" y2="107.3" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="68.0" x2="810" y2="68.0" stroke="var(--border-chassis)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <text x="55" y="189.5" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">0</text><text x="55" y="150.2" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">550</text><text x="55" y="110.8" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">1.1k</text><text x="55" y="71.5" fill="var(--text-dim)" font-size="10" text-anchor="end" class="font-mono">1.6k</text>
  <text x="65.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-5</text><text x="214.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-4</text><text x="363.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-3</text><text x="512.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-2</text><text x="661.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-1</text><text x="810.0" y="204" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">NOW</text>

  <!-- CHART AREA & BEZIER SPLINE -->
  <path d="M 65.0 186 L 65.0 184.9 C 132.1 184.9, 146.9 181.4, 214.0 181.4 C 281.1 181.4, 295.9 172.4, 363.0 172.4 C 430.1 172.4, 444.9 151.7, 512.0 151.7 C 579.0 151.7, 594.0 118.1, 661.0 118.1 C 728.0 118.1, 743.0 68.0, 810.0 68.0 L 810.0 186 Z" fill="url(#modern-star-area)" shape-rendering="geometricPrecision"/>
  <path d="M 65.0 184.9 C 132.1 184.9, 146.9 181.4, 214.0 181.4 C 281.1 181.4, 295.9 172.4, 363.0 172.4 C 430.1 172.4, 444.9 151.7, 512.0 151.7 C 579.0 151.7, 594.0 118.1, 661.0 118.1 C 728.0 118.1, 743.0 68.0, 810.0 68.0" fill="none" stroke="url(#modern-starchart-accent-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision"/>

  <!-- DATA VERTICES -->
  <circle cx="65.0" cy="184.9" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="214.0" cy="181.4" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="363.0" cy="172.4" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="512.0" cy="151.7" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/><circle cx="661.0" cy="118.1" r="3" fill="var(--bg-panel)" stroke="var(--primary)" stroke-width="1.5"/>
    <!-- Peak Milestone Marker -->
    <circle cx="810.0" cy="68.0" r="8" fill="var(--accent)" opacity="0.2"/>
    <circle cx="810.0" cy="68.0" r="5" fill="var(--bg-glass)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="810.0" cy="68.0" r="2" fill="var(--primary)"/>
    <!-- Peak Callout Pill -->
    <g transform="translate(760.0, 38.0)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="38" y="15" fill="var(--accent)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 1280</text>
    </g>
</svg>