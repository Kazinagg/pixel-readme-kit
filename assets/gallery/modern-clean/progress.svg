<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 72" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
  </defs>

  <!-- Modern Card Background -->
  <rect x="2" y="2" width="846" height="68" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>

  <!-- Label & Percentage Pill -->
  <text x="18" y="22" fill="var(--text-main)" font-size="12" font-weight="600" class="font-sans">SPRINT COMPLETION</text>
  <g transform="translate(774, 9)">
    <rect x="0" y="0" width="58" height="20" rx="10" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="29" y="14" fill="var(--primary)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">85%</text>
  </g>

  <!-- Continuous Track & Filled Bar -->
  <rect x="18" y="34" width="814" height="10" rx="5" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
  <rect x="18" y="34" width="691.9" height="10" rx="5" fill="url(#progGrad)"/>

  <!-- Subtext & Milestone Indicators -->
  <text x="18" y="58" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">34 OF 40 TASKS COMPLETED (85%)</text>
  <text x="832" y="58" fill="var(--text-dim)" font-size="11" font-weight="500" text-anchor="end" class="font-sans">0% • 50% • 100%</text>
</svg>