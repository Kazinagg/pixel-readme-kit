<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 22" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>

  <!-- Subtle Connecting 1px Line -->
  <line x1="12" y1="11" x2="312" y2="11" stroke="var(--border-chassis)" stroke-width="1"/>
  <line x1="538" y1="11" x2="838" y2="11" stroke="var(--border-chassis)" stroke-width="1"/>

  <!-- Center Pill Badge -->
  <g transform="translate(324, 1)">
    <rect x="0" y="0" width="203" height="20" rx="10" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <circle cx="10" cy="10" r="2.5" fill="var(--primary)"/>
    <text x="105" y="14" fill="var(--text-main)" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">SECTION // TELEMETRY METRICS</text>
  </g>
</svg>