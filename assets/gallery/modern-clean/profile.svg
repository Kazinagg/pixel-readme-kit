<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="100%">
  <defs>
        <linearGradient id="modern-profile-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
    <linearGradient id="modern-profile-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.6" />
      <stop offset="100%" stop-color="var(--border-chassis)" stop-opacity="0.3" />
    </linearGradient>
    <style>
      
      :root {
        --bg-glass: rgba(15, 23, 42, 0.90);
        --bg-panel: rgba(30, 41, 59, 0.85);
        --border-chassis: rgba(51, 65, 85, 0.85);
        --primary: #38BDF8;
        --accent: #818CF8;
        --tertiary: #06B6D4;
        --title-front: #38BDF8;
        --title-mid: #0284C7;
        --title-dark: #0369A1;
        --text-main: #F8FAFC;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 23, 42, 0.90);
          --bg-panel: rgba(30, 41, 59, 0.85);
          --border-chassis: rgba(51, 65, 85, 0.85);
          --primary: #38BDF8;
          --accent: #818CF8;
          --tertiary: #06B6D4;
          --title-front: #38BDF8;
          --title-mid: #0284C7;
          --title-dark: #0369A1;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #0284C7;
          --accent: #4F46E5;
          --tertiary: #0891B2;
          --title-front: #0284C7;
          --title-mid: #0369A1;
          --title-dark: #0C4A6E;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #38BDF8));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>

  <!-- CHASSIS -->
  <rect x="2" y="2" width="846" height="186" rx="14" fill="var(--bg-glass)" stroke="url(#modern-profile-border-grad)" stroke-width="1.2"/>
  <path d="M 16 2 L 834 2" stroke="url(#modern-profile-accent-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- CIRCULAR AVATAR WITH GRADIENT RING -->
  <g>
    <!-- Outer halo ring -->
    <circle cx="95" cy="87" r="46" fill="none" stroke="url(#modern-profile-accent-grad)" stroke-width="2"/>
    <!-- Inner panel circle -->
    <circle cx="95" cy="87" r="43" fill="var(--bg-panel)"/>
    <!-- Vector User Silhouette -->
    <circle cx="95" cy="77" r="15" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.8"/>
    <path d="M 71 113 C 71 95, 119 95, 119 113 Z" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.8"/>
    <circle cx="95" cy="77" r="5" fill="var(--accent)"/>
  </g>

  <!-- STATUS PILL (UNDER AVATAR) -->
  <g transform="translate(53, 144)">
    <rect x="0" y="0" width="84" height="20" rx="10" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <circle cx="12" cy="10" r="3" fill="var(--status)"/>
    <text x="20" y="13.5" fill="var(--status)" font-size="9.5" font-weight="700" class="font-sans">ONLINE</text>
  </g>

  <!-- BADGE AND LOCATION PILLS (TOP RIGHT) -->
  <g transform="translate(653, 24)">
    <rect x="0" y="0" width="75" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="37" y="16" fill="var(--accent)" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">CORE_DEV</text>
    <rect x="83" y="0" width="90" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="128" y="16" fill="var(--text-dim)" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">TOKYO / NET</text>
  </g>

  <!-- NAME TYPOGRAPHY -->
  <text x="180" y="56" fill="url(#modern-profile-accent-grad)" font-size="26" font-weight="800" letter-spacing="-0.02em" class="font-sans">CYBER_ARCHITECT</text>

  <!-- ROLE PILL -->
  <g transform="translate(180, 72)">
    <rect x="0" y="0" width="149" height="24" rx="12" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="12" y="16" fill="var(--accent)" font-size="11.5" font-weight="600" class="font-sans">SYSTEM SPECIALIST</text>
  </g>

  <!-- BIO SUMMARY -->
  <text x="180" y="128" fill="var(--text-main)" font-size="12.5" font-weight="400" class="font-sans">Building modular pixel and vector HUD experiences for GitHub readmes</text>
</svg>