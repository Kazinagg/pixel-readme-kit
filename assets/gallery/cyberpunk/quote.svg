<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 42" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 14, 23, 0.85);
        --bg-panel: rgba(15, 23, 38, 0.82);
        --border-chassis: rgba(30, 41, 59, 0.85);
        --primary: #00C8D7;
        --accent: #A855F7;
        --tertiary: #FF0055;
        --title-front: #00C8D7;
        --title-mid: #006B74;
        --title-dark: #002B2F;
        --text-main: #F8F8F2;
        --text-dim: #94A3B8;
        --status: #00D26A;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Background Glass (Flush left to connect with markdown quote border) -->
  <rect x="0" y="0" width="850" height="42" fill="var(--bg-glass)"/>
  <!-- Top Rail -->
  <line x1="0" y1="2" x2="849" y2="2" stroke="var(--primary)" stroke-width="2"/><line x1="849" y1="2" x2="849" y2="38" stroke="var(--primary)" stroke-width="2"/><rect x="844" y="2" width="5" height="5" fill="var(--primary)"/>
  <!-- Badge -->
  <rect x="8" y="8" width="120" height="24" fill="var(--bg-panel)" stroke="#2f81f7" stroke-width="1.5"/><circle cx="20" cy="20" r="3.5" fill="#2f81f7"/><text x="74" y="24" fill="#2f81f7" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">NOTE // 0x01</text>
  <!-- Title & Subtitle (Properly offset past badge edge) -->
  <text x="142" y="20" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">ARCHITECTURAL NOTICE</text>
  <text x="142" y="33" fill="var(--accent)" font-size="11" class="font-mono">Component standard guarantees deterministic SVG rendering across dark and light modes.</text>
  <!-- DASHED BOTTOM LINE: Bridges into live markdown text -->
  <line x1="0" y1="41" x2="845" y2="41" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.75"/>
  
</svg>