<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 24" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 14, 23, 0.85);
        --bg-panel: rgba(15, 23, 38, 0.82);
        --border-chassis: rgba(30, 41, 59, 0.85);
        --primary: #00C8D7;
        --accent: #A855F7;
        --tertiary: #FF0055;
        --title-front: #00C8D7;
        --title-mid: #006B74;
        --title-dark: #002B2F;
        --text-main: #F8F8F2;
        --text-dim: #94A3B8;
        --status: #00D26A;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --tertiary: #FF0055;
          --title-front: #00C8D7;
          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- UPWARD PRONGS (FLUSH TO EDGES x=1..849) -->
  <line x1="1" y1="0" x2="1" y2="12" stroke="var(--primary)" stroke-width="2.5"/><rect x="0" y="0" width="4" height="5" fill="var(--primary)"/>
  <line x1="849" y1="0" x2="849" y2="12" stroke="var(--primary)" stroke-width="2.5"/><rect x="846" y="0" width="4" height="5" fill="var(--primary)"/>
  <line x1="1" y1="12" x2="849" y2="12" stroke="var(--border-chassis)" stroke-width="3"/>
  <line x1="6" y1="12" x2="844" y2="12" stroke="var(--primary)" stroke-width="1.5" opacity="0.85"/>
  <path d="M 1 12 L 1 20 L 16 20" fill="none" stroke="var(--primary)" stroke-width="1.5"/><rect x="1" y="17" width="4" height="4" fill="var(--accent)"/>
  <path d="M 849 12 L 849 20 L 834 20" fill="none" stroke="var(--primary)" stroke-width="1.5"/><rect x="845" y="17" width="4" height="4" fill="var(--accent)"/>
  <rect x="309" y="4" width="231" height="16" fill="var(--bg-glass)" stroke="var(--accent)" stroke-width="1"/>
  <text x="425" y="15" fill="var(--primary)" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[ TTY // 0x00 OK // BUFFER RELEASED ]</text>
</svg>