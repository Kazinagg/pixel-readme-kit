<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 98" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(15, 18, 30, 0.85);
        --bg-panel: rgba(22, 27, 46, 0.80);
        --border-chassis: rgba(41, 46, 66, 0.85);
        --primary: #4F8BFF;
        --accent: #A855F7;
        --tertiary: #06B6D4;
        --title-front: #4F8BFF;
        --title-mid: #2563EB;
        --title-dark: #1E3A8A;
        --text-main: #F1F5F9;
        --text-dim: #94A3B8;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 18, 30, 0.85);
          --bg-panel: rgba(22, 27, 46, 0.80);
          --border-chassis: rgba(41, 46, 66, 0.85);
          --primary: #4F8BFF;
          --accent: #A855F7;
          --tertiary: #06B6D4;
          --title-front: #4F8BFF;
          --title-mid: #2563EB;
          --title-dark: #1E3A8A;
          --text-main: #F1F5F9;
          --text-dim: #94A3B8;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F8FAFC;
          --bg-panel: #F1F5F9;
          --border-chassis: #E2E8F0;
          --primary: #1D4ED8;
          --accent: #6D28D9;
          --tertiary: #0891B2;
          --title-front: #1D4ED8;
          --title-mid: #1E40AF;
          --title-dark: #0F172A;
          --text-main: #0F172A;
          --text-dim: #64748B;
          --status: #16A34A;
          --warning: #D97706;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #4F8BFF));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-mono-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
      .font-mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-mono-tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g id="metric-card-0">
    
    <rect x="1" y="3" width="274" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="1" y1="3" x2="275" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="269" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="15" y="25" fill="var(--text-dim)" class="font-mono-lbl">CORE UPTIME</text>
    <rect x="205" y="13" width="58" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="234" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">NOMINAL</text>
    <text x="15" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">99.98%</text>
    <text x="15" y="79" fill="var(--text-dim)" class="font-mono-sub">● +0.02%</text>
    
    <path d="M 221 81 L 231 75 L 241 83 L 251 71 L 261 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="261" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-1">
    
    <rect x="287" y="3" width="274" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="287" y1="3" x2="561" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="555" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="301" y="25" fill="var(--text-dim)" class="font-mono-lbl">LATENCY</text>
    <rect x="491" y="13" width="58" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="520" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">OPTIMAL</text>
    <text x="301" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">12ms</text>
    <text x="301" y="79" fill="var(--text-dim)" class="font-mono-sub">● -3ms</text>
    
    <path d="M 507 81 L 517 75 L 527 83 L 537 71 L 547 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="547" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-2">
    
    <rect x="573" y="3" width="274" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="573" y1="3" x2="847" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="841" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="587" y="25" fill="var(--text-dim)" class="font-mono-lbl">BUFFER</text>
    <rect x="779" y="13" width="56" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="807" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">STABLE</text>
    <text x="587" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">256MB</text>
    <text x="587" y="79" fill="var(--text-dim)" class="font-mono-sub">● +14MB</text>
    
    <path d="M 793 81 L 803 75 L 813 83 L 823 71 L 833 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="833" cy="77" r="2" fill="var(--accent)"/>

  </g>
</svg>