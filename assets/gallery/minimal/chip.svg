    <circle cx="177" cy="8" r="1.1" opacity="0.55"/><circle cx="177" cy="13" r="1.1" opacity="0.55"/><circle cx="177" cy="18" r="1.1" opacity="0.55"/>
    <circle cx="184" cy="10" r="1" opacity="0.35"/><circle cx="184" cy="16" r="1" opacity="0.35"/>
    <circle cx="191" cy="7" r="0.8" opacity="0.2"/><circle cx="191" cy="14" r="0.8" opacity="0.2"/>
  </g>
  <text x="82" y="17" fill="var(--primary)" text-anchor="middle" class="chip-text">STATUS: 200 OK</text>
