<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 26" width="155" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
      
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
      .beacon { animation: pulseDot 1.4s infinite ease-in-out; transform-origin: 12px 13px; }
        
    </style>
  </defs>
  
  <rect x="1" y="1" width="153" height="24" fill="rgba(10, 14, 23, 0.85)"/>
  <rect x="1" y="1" width="153" height="24" fill="rgba(245, 158, 11, 0.12)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="1" y="1" width="3" height="3" fill="#EF4444"/>
  <rect x="151" y="1" width="3" height="3" fill="#EF4444"/>
  <rect x="1" y="22" width="3" height="3" fill="#EF4444"/>
  <rect x="151" y="22" width="3" height="3" fill="#EF4444"/>
  <circle cx="12" cy="13" r="3.5" fill="#EF4444" class="beacon"/>
        
  <text x="83" y="17" fill="#EF4444" text-anchor="middle" class="chip-text">
    🔴 LIVE TELEMETRY
  </text>
</svg>