<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 26" width="125" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      .chip-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
      @keyframes targetPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .laser { animation: targetPulse 1.2s infinite ease-in-out; }
    </style>
  </defs>
  <!-- Background Tactical Hull (45° Chamfered Corners) -->
  <polygon points="7 1, 117 1, 123 7, 123 19, 117 25, 7 25, 1 19, 1 7" fill="rgba(20, 14, 6, 0.85)"/>
  <polygon points="7 1, 117 1, 123 7, 123 19, 117 25, 7 25, 1 19, 1 7" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Tactical Reticle / Laser Beacon -->
  <circle cx="14" cy="13" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="14" cy="13" r="2.5" fill="#F59E0B" class="laser"/>
  <!-- Title Text -->
  <text x="68" y="17" fill="#F59E0B" text-anchor="middle" class="chip-text">
    TARGET_LOCK
  </text>
</svg>
