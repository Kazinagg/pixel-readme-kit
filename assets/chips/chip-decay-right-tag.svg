<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 105 26" width="105" height="26" shape-rendering="crispEdges">
  <defs>
    <style>
      .chip-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  
  <!-- Left solid box -->
  <path d="M 85 1 L 1 1 L 1 25 L 85 25" fill="rgba(0, 240, 255, 0.08)" stroke="#BD93F9" stroke-width="1.5"/>
  <rect x="1" y="1" width="3" height="3" fill="#BD93F9"/>
  <rect x="1" y="22" width="3" height="3" fill="#BD93F9"/>

  <!-- Right Pixel Decay (Scattered Dithering) -->
  <g fill="#BD93F9">
    <!-- Column 1 (dense) -->
    <rect x="87" y="3" width="3" height="3"/>
    <rect x="87" y="9" width="3" height="3"/>
    <rect x="87" y="15" width="3" height="3"/>
    <rect x="87" y="20" width="3" height="3"/>

    <!-- Column 2 (medium) -->
    <rect x="92" y="5" width="2" height="2"/>
    <rect x="92" y="12" width="2" height="2"/>
    <rect x="92" y="18" width="2" height="2"/>

    <!-- Column 3 (sparse/scatter) -->
    <rect x="97" y="7" width="2" height="2" opacity="0.6"/>
    <rect x="100" y="14" width="2" height="2" opacity="0.4"/>
    <rect x="103" y="10" width="1" height="1" opacity="0.3"/>
  </g>
        

  <!-- Label Text -->
  <text x="44" y="17" fill="#BD93F9" text-anchor="middle" class="chip-text">
    🏷️ v2.0
  </text>
</svg>