<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 28" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 8px; font-weight: bold; letter-spacing: 1px; }
      @keyframes barPulse {
        0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
        50% { transform: scaleY(1.2); opacity: 1; }
      }
      .s-bar { transform-origin: center; animation: barPulse 1.6s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Baseline Hairline -->
  <line x1="20" y1="14" x2="345" y2="14" stroke="rgba(41, 46, 66, 0.85)" stroke-width="1.5"/>
  <line x1="505" y1="14" x2="830" y2="14" stroke="rgba(41, 46, 66, 0.85)" stroke-width="1.5"/>

  <!-- Accent Inner Glow Line -->
  <line x1="60" y1="14" x2="330" y2="14" stroke="#4F8BFF" stroke-width="1" opacity="0.6" stroke-dasharray="12,4"/>
  <line x1="520" y1="14" x2="790" y2="14" stroke="#4F8BFF" stroke-width="1" opacity="0.6" stroke-dasharray="12,4"/>

  <!-- Caliper Ticks at Outer Ends -->
  <path d="M 20 8 L 20 14 L 32 14" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <rect x="20" y="12" width="4" height="4" fill="#00F0FF"/>
  <path d="M 830 8 L 830 14 L 818 14" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <rect x="826" y="12" width="4" height="4" fill="#00F0FF"/>

  <!-- Frequency Telemetry Badges -->
  <text x="240" y="11" fill="#4F8BFF" text-anchor="middle" opacity="0.7" class="font-mono">// 44.1 kHz //</text>
  <text x="610" y="11" fill="#4F8BFF" text-anchor="middle" opacity="0.7" class="font-mono">// SPECTRUM_HUD //</text>

  <!-- Center Equalizer Pod -->
  <rect x="355" y="2" width="140" height="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(41, 46, 66, 0.85)" stroke-width="1"/>
  <rect x="365" y="11" width="4" height="6" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.1s;"/><rect x="373" y="8" width="4" height="12" fill="#00F0FF" class="s-bar" style="animation-delay: 0.4s;"/><rect x="381" y="5" width="4" height="18" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.2s;"/><rect x="389" y="9" width="4" height="10" fill="#A855F7" class="s-bar" style="animation-delay: 0.6s;"/><rect x="397" y="3" width="4" height="22" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.3s;"/><rect x="405" y="7" width="4" height="14" fill="#00F0FF" class="s-bar" style="animation-delay: 0.5s;"/><rect x="413" y="4" width="4" height="20" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.1s;"/><rect x="421" y="2" width="4" height="24" fill="#00F0FF" class="s-bar" style="animation-delay: 0.7s;"/><rect x="429" y="5" width="4" height="18" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.3s;"/><rect x="437" y="8" width="4" height="12" fill="#A855F7" class="s-bar" style="animation-delay: 0.5s;"/><rect x="445" y="3" width="4" height="22" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.2s;"/><rect x="453" y="10" width="4" height="8" fill="#00F0FF" class="s-bar" style="animation-delay: 0.6s;"/><rect x="461" y="6" width="4" height="16" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.4s;"/><rect x="469" y="9" width="4" height="10" fill="#00F0FF" class="s-bar" style="animation-delay: 0.1s;"/><rect x="477" y="11" width="4" height="6" fill="#4F8BFF" class="s-bar" style="animation-delay: 0.3s;"/>
</svg>