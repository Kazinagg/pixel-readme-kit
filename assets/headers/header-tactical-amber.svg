<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes targetScan {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateX(750px); opacity: 0; }
      }
      @keyframes pulseLock {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.96); }
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .laser-scan {
        animation: targetScan 4s ease-in-out infinite;
      }
      .reticle-pulse {
        transform-origin: 750px 105px;
        animation: pulseLock 2s infinite ease-in-out;
      }
    </style>
  </defs>
