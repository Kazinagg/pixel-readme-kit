<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 26" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes traceFlow {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(950px); }
      }
      .flow-packet {
        animation: traceFlow 3.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Bus line -->
  <line x1="20" y1="13" x2="830" y2="13" stroke="rgba(30, 41, 59, 0.85)" stroke-width="4"/>
  <line x1="20" y1="13" x2="830" y2="13" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>

  <!-- Auxiliary trace top -->
  <path d="M 50 6 L 150 6 L 160 13 L 300 13 L 310 6 L 500 6 L 510 13 L 720 13 L 730 6 L 800 6" fill="none" stroke="#BD93F9" stroke-width="1.5" opacity="0.5"/>
  <!-- Auxiliary trace bottom -->
  <path d="M 40 20 L 110 20 L 120 13 L 240 13 L 250 20 L 440 20 L 450 13 L 650 13 L 660 20 L 810 20" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.4"/>

  <!-- Soldering pads / Vias -->
  <rect x="20" y="10" width="6" height="6" fill="#FFE600"/>
  <rect x="21" y="11" width="4" height="4" fill="rgba(10, 14, 23, 0.9)"/>

  <rect x="50" y="3" width="6" height="6" fill="#00F0FF"/>
  <rect x="51" y="4" width="4" height="4" fill="rgba(10, 14, 23, 0.9)"/>

  <rect x="150" y="3" width="6" height="6" fill="#BD93F9"/>
  <rect x="240" y="10" width="6" height="6" fill="#39FF14"/>

  <g transform="translate(425, 13)">
    <rect x="-10" y="-8" width="20" height="16" fill="rgba(15, 23, 38, 0.65)" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FFE600"/>
  </g>

  <rect x="600" y="10" width="6" height="6" fill="#39FF14"/>
  <rect x="730" y="3" width="6" height="6" fill="#00F0FF"/>
  <rect x="830" y="10" width="6" height="6" fill="#FFE600"/>
  <rect x="831" y="11" width="4" height="4" fill="rgba(10, 14, 23, 0.9)"/>

  <!-- Moving Data Packet -->
  <g class="flow-packet">
    <rect x="0" y="11" width="12" height="4" fill="#FFE600"/>
    <rect x="12" y="12" width="8" height="2" fill="#FFFFFF"/>
    <rect x="-8" y="12" width="8" height="2" fill="#FF0055"/>
  </g>
</svg>