<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 42" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #00C8D7; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <!-- Background Glass (Flush left to connect with > border-left) -->
  <rect x="0" y="0" width="850" height="42" fill="rgba(10, 14, 23, 0.75)"/>
  <!-- Top Tech Rail (Open left x=0, capped on right x=849) -->
  <line x1="0" y1="2" x2="849" y2="2" stroke="#00C8D7" stroke-width="2"/>
  <line x1="849" y1="2" x2="849" y2="38" stroke="#00C8D7" stroke-width="2"/>
  <rect x="844" y="2" width="5" height="5" fill="#00C8D7"/>
  <!-- Badge & Indicator -->
  <rect x="8" y="8" width="120" height="24" fill="rgba(0, 200, 215, 0.18)" stroke="#00C8D7" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="3.5" fill="#00C8D7" class="led"/>
  <text x="73" y="24" fill="#00C8D7" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">NOTE // 0x01</text>
  <!-- Title -->
  <text x="140" y="20" fill="#F8F8F2" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">
    CYBERPUNK QUOTE HEADER // RUNTIME SPEC
  </text>
  <text x="140" y="33" fill="#A855F7" font-size="8.5" class="font-mono">Left edge opens into &gt; blockquote // Content continues below</text>
  <!-- DASHED BOTTOM LINE: Bridges into live markdown text -->
  <line x1="0" y1="41" x2="845" y2="41" stroke="#00C8D7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.75"/>
  <polygon points="8 41, 14 38, 14 41" fill="#00C8D7"/>
</svg>