<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      
      @keyframes alertPulse { 0%, 100% { opacity: 1; fill: #FF0055; } 50% { opacity: 0.2; fill: #450A0A; } }
      .alert-led { animation: alertPulse 1.2s infinite steps(1); }

    </style>
  </defs>

  <!-- Chassis Plate -->
  <rect x="4" y="4" width="842" height="40" fill="rgba(25, 8, 14, 0.85)" stroke="rgba(255, 0, 85, 0.6)" stroke-width="1.5"/>
  <line x1="6" y1="4" x2="20" y2="4" stroke="#FF0055" stroke-width="3"/>
  <line x1="830" y1="4" x2="844" y2="4" stroke="#FF0055" stroke-width="3"/>
  <line x1="6" y1="44" x2="20" y2="44" stroke="#FF0055" stroke-width="3"/>
  <line x1="830" y1="44" x2="844" y2="44" stroke="#FF0055" stroke-width="3"/>

  <!-- Left Callout Tag Badge -->
  <rect x="12" y="10" width="150" height="28" fill="rgba(255, 0, 85, 0.15)" stroke="#FF0055" stroke-width="1.5"/>
  <rect x="12" y="10" width="3" height="3" fill="#FF0055"/>
  <rect x="159" y="10" width="3" height="3" fill="#FF0055"/>
  <rect x="12" y="35" width="3" height="3" fill="#FF0055"/>
  <rect x="159" y="35" width="3" height="3" fill="#FF0055"/>
  <text x="87" y="28" fill="#FF0055" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">
    🚨 CRITICAL // FAULT
  </text>

  <!-- Title / Message Text -->
  <text x="175" y="21" fill="#F8F8F2" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">
    FATAL EXCEPTION // EMERGENCY OVERRIDE ENGAGED
  </text>
  <text x="175" y="36" fill="#94A3B8" font-size="9" class="font-mono">XML unescaped ampersands will break Camo proxy</text>

  <!-- Decorative Elements -->
  <circle cx="826" cy="24" r="5" fill="#FF0055" class="alert-led"/>
</svg>