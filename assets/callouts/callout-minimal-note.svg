<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      @keyframes breatheLed { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.3; } }
      .breathe { animation: breatheLed 2.2s infinite ease-in-out; }
    </style>
  </defs>
  <!-- Flat Minimal Glass Panel -->
  <rect x="1" y="2" width="848" height="44" fill="rgba(15, 18, 30, 0.85)" stroke="rgba(41, 46, 66, 0.9)" stroke-width="1.5"/>
  <!-- Corner Hugger Ticks -->
  <path d="M 5 12 L 5 5 L 14 5" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 845 12 L 845 5 L 836 5" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 5 36 L 5 43 L 14 43" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <path d="M 845 36 L 845 43 L 836 43" fill="none" stroke="#4F8BFF" stroke-width="1.5"/>
  <!-- Minimal Badge -->
  <rect x="16" y="11" width="130" height="26" fill="rgba(79, 139, 255, 0.12)" stroke="#4F8BFF" stroke-width="1"/>
  <text x="81" y="28" fill="#4F8BFF" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">INFO // MINIMAL</text>
  <!-- Text Content -->
  <text x="160" y="22" fill="#F8F8F2" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">
    MINIMAL GLASS SPECIFICATION // ZERO DOUBLE BORDERS
  </text>
  <text x="160" y="36" fill="#A855F7" font-size="9" class="font-mono">Seamless integration with GitHub blockquote &gt; and monolith tables</text>
  <!-- Right Telemetry -->
  <text x="830" y="28" fill="#4F8BFF" font-size="9" font-weight="bold" text-anchor="end" class="font-mono breathe">OK // 0x4F</text>
</svg>