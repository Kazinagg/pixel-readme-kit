<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #00C8D7; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <!-- Cyberpunk Chassis with Corner Notches -->
  <rect x="2" y="2" width="846" height="44" fill="rgba(10, 14, 23, 0.85)" stroke="#00C8D7" stroke-width="1.5"/>
  <rect x="2" y="2" width="5" height="5" fill="#00C8D7"/>
  <rect x="843" y="2" width="5" height="5" fill="#00C8D7"/>
  <rect x="2" y="41" width="5" height="5" fill="#00C8D7"/>
  <rect x="843" y="41" width="5" height="5" fill="#00C8D7"/>
  <!-- Status Badge -->
  <rect x="14" y="10" width="140" height="28" fill="rgba(0, 200, 215, 0.15)" stroke="#00C8D7" stroke-width="1.5"/>
  <circle cx="26" cy="24" r="3.5" fill="#00C8D7" class="led"/>
  <text x="88" y="28" fill="#00C8D7" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">NOTE // 0x01</text>
  <!-- Text Content -->
  <text x="168" y="22" fill="#F8F8F2" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">
    CYBERPUNK NOTICE // SYSTEM SPECIFICATION
  </text>
  <text x="168" y="36" fill="#94A3B8" font-size="9" class="font-mono">Dual-theme high contrast &gt; 7:1 // Monospace typography</text>
  <!-- Right Control Accents -->
  <rect x="815" y="14" width="20" height="20" fill="rgba(30, 41, 59, 0.85)"/>
  <text x="825" y="28" fill="#00C8D7" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">ℹ</text>
</svg>