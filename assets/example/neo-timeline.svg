<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #00C8D7;
        --accent: #A855F7;
        --title-front: #00C8D7;
        --title-mid: #007881;
        --title-dark: #003c40;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #1A7F37;
        --warning: #9A6700;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 14, 23, 0.85);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(30, 41, 59, 0.85);
          --primary: #00C8D7;
          --accent: #A855F7;
          --title-front: #00C8D7;
          --title-mid: #005a60;
          --title-dark: #001e20;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-time-date { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-time-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: bold; }
      .font-time-stat { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-time-desc { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: normal; }
    </style>
  </defs>
  <!-- Vertical Data PCB Bus -->
  <line x1="42" y1="14" x2="42" y2="236" stroke="var(--border-chassis)" stroke-width="2"/>
  <circle cx="42" cy="14" r="3" fill="var(--primary)"/>
  <polygon points="42,242 46,236 38,236" fill="var(--primary)"/>
  <g id="milestone-0">
    <path d="M 48 28 L 70 28" stroke="var(--status)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <polygon points="42,22 48,28 42,34 36,28" fill="var(--status)"/>
    <rect x="70" y="10" width="778" height="52" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <line x1="70" y1="10" x2="78" y2="10" stroke="var(--status)" stroke-width="2"/>
    <line x1="70" y1="10" x2="70" y2="18" stroke="var(--status)" stroke-width="2"/>
    <rect x="843" y="12" width="3" height="3" fill="var(--status)"/>
    <!-- Milestone Header -->
    <rect x="82" y="19" width="60" height="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="112" y="30" fill="var(--text-dim)" text-anchor="middle" class="font-time-date">2026-Q1</text>
    <text x="152" y="30" fill="var(--title-front)" class="font-time-title">CORE ENGINE</text>
    <text x="834" y="30" fill="var(--status)" text-anchor="end" class="font-time-stat">● COMPLETED</text>
    <!-- Milestone Description -->
    <text x="84" y="50" fill="var(--text-dim)" class="font-time-desc">Vector pixel rendering pipeline</text>
  </g>
  <g id="milestone-1">
    <path d="M 48 94 L 70 94" stroke="var(--status)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <polygon points="42,88 48,94 42,100 36,94" fill="var(--status)"/>
    <rect x="70" y="76" width="778" height="52" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <line x1="70" y1="76" x2="78" y2="76" stroke="var(--status)" stroke-width="2"/>
    <line x1="70" y1="76" x2="70" y2="84" stroke="var(--status)" stroke-width="2"/>
    <rect x="843" y="78" width="3" height="3" fill="var(--status)"/>
    <!-- Milestone Header -->
    <rect x="82" y="85" width="60" height="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="112" y="96" fill="var(--text-dim)" text-anchor="middle" class="font-time-date">2026-Q2</text>
    <text x="152" y="96" fill="var(--title-front)" class="font-time-title">LIVE METRICS</text>
    <text x="834" y="96" fill="var(--status)" text-anchor="end" class="font-time-stat">● COMPLETED</text>
    <!-- Milestone Description -->
    <text x="84" y="116" fill="var(--text-dim)" class="font-time-desc">Realtime HUD KPI &amp; progress widgets</text>
  </g>
  <g id="milestone-2">
    <path d="M 48 160 L 70 160" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="42" cy="160" r="6" fill="var(--accent)"/>
    <circle cx="42" cy="160" r="10" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <rect x="70" y="142" width="778" height="52" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <line x1="70" y1="142" x2="78" y2="142" stroke="var(--accent)" stroke-width="2"/>
    <line x1="70" y1="142" x2="70" y2="150" stroke="var(--accent)" stroke-width="2"/>
    <rect x="843" y="144" width="3" height="3" fill="var(--accent)"/>
    <!-- Milestone Header -->
    <rect x="82" y="151" width="60" height="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="112" y="162" fill="var(--text-dim)" text-anchor="middle" class="font-time-date">2026-Q3</text>
    <text x="152" y="162" fill="var(--title-front)" class="font-time-title">STUDIO &amp; MCP</text>
    <text x="834" y="162" fill="var(--accent)" text-anchor="end" class="font-time-stat">◉ IN_PROGRESS</text>
    <!-- Milestone Description -->
    <text x="84" y="182" fill="var(--text-dim)" class="font-time-desc">Zero-dep web studio &amp; AI model protocol</text>
  </g>
  <g id="milestone-3">
    <path d="M 48 226 L 70 226" stroke="var(--text-dim)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="42" cy="226" r="5" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
    <rect x="70" y="208" width="778" height="52" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <line x1="70" y1="208" x2="78" y2="208" stroke="var(--text-dim)" stroke-width="2"/>
    <line x1="70" y1="208" x2="70" y2="216" stroke="var(--text-dim)" stroke-width="2"/>
    <rect x="843" y="210" width="3" height="3" fill="var(--text-dim)"/>
    <!-- Milestone Header -->
    <rect x="82" y="217" width="60" height="14" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="112" y="228" fill="var(--text-dim)" text-anchor="middle" class="font-time-date">2026-Q4</text>
    <text x="152" y="228" fill="var(--title-front)" class="font-time-title">GLOBAL CDN</text>
    <text x="834" y="228" fill="var(--text-dim)" text-anchor="end" class="font-time-stat">○ PLANNED</text>
    <!-- Milestone Description -->
    <text x="84" y="248" fill="var(--text-dim)" class="font-time-desc">Dynamic edge badge synthesis</text>
  </g>
</svg>