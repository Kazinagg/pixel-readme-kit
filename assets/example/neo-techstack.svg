<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #6e4704;
        --title-dark: #241701;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #6e4704;
          --title-dark: #241701;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #ab6e07;
          --accent: #EA580C;
          --tertiary: #B91C1C;
          --title-front: #ab6e07;
          --title-mid: #664204;
          --title-dark: #332102;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-tech-name { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-tech-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
