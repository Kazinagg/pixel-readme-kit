<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #F59E0B; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>

  
  <polygon points="14 4, 836 4, 846 14, 846 32, 4 32, 4 14"
           fill="rgba(20, 14, 6, 0.82)" stroke="rgba(50, 36, 16, 0.85)" stroke-width="2"/>
  <polygon points="16 7, 834 7, 843 16, 843 29, 7 29, 7 16"
           fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.85"/>
  <!-- Tech sliding dot line -->
  <line x1="30" y1="32" x2="820" y2="32" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
        
  
  <!-- 45° ANGLED GUIDE WINGS -->
  <path d="M 4 28 L 4 38 L 10 38" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 846 28 L 846 38 L 840 38" fill="none" stroke="#F59E0B" stroke-width="2"/>
        

  <!-- Status LED -->
  <circle cx="24" cy="18" r="4" fill="#F59E0B" class="led"/>

  <!-- Title Text -->
  <text x="36" y="22" fill="#F59E0B" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ HUD.CHAMFER // TACTICAL_ENCLOSURE.EXE
  </text>

  <!-- Right Status Tag -->
  <rect x="670" y="9" width="105" height="18" fill="rgba(30, 22, 10, 0.78)" stroke="#F59E0B" stroke-width="1"/>
  <text x="723" y="22" fill="#F59E0B" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[TACTICAL]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="782" y="11" width="14" height="14" fill="rgba(50, 36, 16, 0.85)"/>
  <text x="786" y="21" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="rgba(50, 36, 16, 0.85)"/>
  <text x="803" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="#FF0055"/>
  <text x="822" y="22" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>