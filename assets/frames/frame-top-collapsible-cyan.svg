<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #00C8D7; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>

  
  <rect x="1" y="2" width="848" height="34" fill="rgba(15, 23, 38, 0.78)" opacity="0.75" stroke="#00C8D7" stroke-width="1.5"/>
  <polygon points="12 13, 19 18, 12 23" fill="#00C8D7"/>
  <path d="M 6 12 L 6 6 L 14 6" fill="none" stroke="#00C8D7" stroke-width="1.5"/>
  <path d="M 844 12 L 844 6 L 836 6" fill="none" stroke="#00C8D7" stroke-width="1.5"/>
  <line x1="8" y1="35" x2="842" y2="35" stroke="#00C8D7" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
        
  

  <!-- Status LED -->
  <circle cx="24" cy="18" r="4" fill="#00C8D7" class="led"/>

  <!-- Title Text -->
  <text x="36" y="22" fill="#00C8D7" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ INTERACTIVE.TERMINAL // CLICK_TO_TOGGLE.SYS
  </text>

  <!-- Right Status Tag -->
  <rect x="670" y="9" width="105" height="18" fill="rgba(15, 23, 38, 0.78)" stroke="#00C8D7" stroke-width="1"/>
  <text x="723" y="22" fill="#00C8D7" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[▶ TOGGLE]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="782" y="11" width="14" height="14" fill="rgba(30, 41, 59, 0.85)"/>
  <text x="786" y="21" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="rgba(30, 41, 59, 0.85)"/>
  <text x="803" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="#FF0055"/>
  <text x="822" y="22" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>