<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #00D26A; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>

  
  <rect x="6" y="4" width="838" height="28" fill="rgba(6, 18, 12, 0.82)" stroke="rgba(20, 45, 25, 0.85)" stroke-width="2"/>
  <rect x="8" y="6" width="834" height="24" fill="none" stroke="#00D26A" stroke-width="1.5" opacity="0.85"/>
  <!-- Top corner notches -->
  <rect x="6" y="4" width="5" height="5" fill="#00D26A"/>
  <rect x="839" y="4" width="5" height="5" fill="#00D26A"/>
        
  
  <!-- DOWNWARD EMBRACING PRONGS (OPENING INTO CONTENT) -->
  <line x1="6" y1="24" x2="6" y2="38" stroke="#00D26A" stroke-width="2.5"/>
  <rect x="4" y="32" width="5" height="6" fill="#00D26A"/>
  <line x1="844" y1="24" x2="844" y2="38" stroke="#00D26A" stroke-width="2.5"/>
  <rect x="841" y="32" width="5" height="6" fill="#00D26A"/>
        

  <!-- Status LED -->
  <circle cx="24" cy="18" r="4" fill="#00D26A" class="led"/>

  <!-- Title Text -->
  <text x="36" y="22" fill="#00D26A" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ SYSTEM.CORE // MATRIX_STREAM.SYS
  </text>

  <!-- Right Status Tag -->
  <rect x="670" y="9" width="105" height="18" fill="rgba(12, 28, 18, 0.78)" stroke="#00D26A" stroke-width="1"/>
  <text x="723" y="22" fill="#00D26A" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[MATRIX_HUD]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="782" y="11" width="14" height="14" fill="rgba(20, 45, 25, 0.85)"/>
  <text x="786" y="21" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="rgba(20, 45, 25, 0.85)"/>
  <text x="803" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="#FF0055"/>
  <text x="822" y="22" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>