<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 38" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #4F8BFF; } 50% { fill: #1E293B; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>

  
  <rect x="1" y="4" width="848" height="28" fill="rgba(15, 18, 30, 0.82)" stroke="rgba(41, 46, 66, 0.85)" stroke-width="2"/>
  <line x1="1" y1="32" x2="849" y2="32" stroke="#4F8BFF" stroke-width="1.5" opacity="0.85"/>
  <rect x="1" y="4" width="4" height="4" fill="#4F8BFF"/>
  <rect x="845" y="4" width="4" height="4" fill="#4F8BFF"/>
        
  
  <line x1="1" y1="26" x2="1" y2="38" stroke="#4F8BFF" stroke-width="2"/>
  <line x1="849" y1="26" x2="849" y2="38" stroke="#4F8BFF" stroke-width="2"/>
        

  <!-- Status LED -->
  <circle cx="24" cy="18" r="4" fill="#4F8BFF" class="led"/>

  <!-- Title Text -->
  <text x="36" y="22" fill="#4F8BFF" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ SYNTH.RAIL // TOKYO_NIGHT_SESSION.SYS
  </text>

  <!-- Right Status Tag -->
  <rect x="670" y="9" width="105" height="18" fill="rgba(22, 27, 46, 0.78)" stroke="#4F8BFF" stroke-width="1"/>
  <text x="723" y="22" fill="#4F8BFF" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[SESSION]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="782" y="11" width="14" height="14" fill="rgba(41, 46, 66, 0.85)"/>
  <text x="786" y="21" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>
  <rect x="800" y="11" width="14" height="14" fill="rgba(41, 46, 66, 0.85)"/>
  <text x="803" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>
  <rect x="818" y="11" width="14" height="14" fill="#FF0055"/>
  <text x="822" y="22" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>