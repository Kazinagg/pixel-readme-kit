[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-kit"
version = "5.1.0"
description = "Universal Customization Engine, Multi-Style Design System & SVG Infographics Studio for GitHub Repositories and Profiles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kazinagg" }
]
keywords = [
    "github", "readme", "github-profile", "customization-system", "design-system",
    "svg-generator", "infographics", "mcp-server", "markdown", "cli", "starchart"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Kazinagg/readme-kit"
Repository = "https://github.com/Kazinagg/readme-kit"
Issues = "https://github.com/Kazinagg/readme-kit/issues"
Changelog = "https://github.com/Kazinagg/readme-kit/blob/main/TODO.md"

[project.scripts]
readme-kit = "generator.cli:main"
readmekit = "generator.cli:main"
pixel-kit = "generator.cli:main"
pixel-readme = "generator.cli:main"
pixel-readme-kit = "generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*"]

[tool.setuptools.package-data]
generator = [
    "templates/*.md",
    "templates/**/*.md",
    "studio/static/*",
    "studio/static/**/*",
    "presets/*.json",
]
