[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-readme-kit"
version = "4.2.0"
description = "Retro-futuristic HUD & Sci-Fi infographics generator for GitHub READMEs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kazinagg" }
]
keywords = ["github", "readme", "pixel-art", "hud", "cyberpunk", "svg", "infographics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
pixel-kit = "generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*"]

[tool.setuptools.package-data]
generator = ["templates/*.md"]
