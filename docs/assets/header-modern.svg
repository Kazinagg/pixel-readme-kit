<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      

    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

      @keyframes pulseLiveDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .live-dot { animation: pulseLiveDot 2.2s infinite ease-in-out; }
    </style>
    <linearGradient id="modernHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Modern Card Background with rounded corners & top gradient highlight -->
  <rect x="2" y="2" width="846" height="196" rx="16" fill="rgba(15, 23, 42, 0.90)" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1.2"/>
  <path d="M 24 2 L 826 2" stroke="url(#modernHeaderGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Clean Vector Typography Header -->
  <text x="36" y="68" font-size="32" font-weight="700" fill="url(#modernHeaderGrad)" class="font-sans" letter-spacing="-0.5">MODERN CLEAN RUNTIME</text>
  
  <!-- Subtitle with Pulse Live Dot -->
  <g transform="translate(36, 98)">
    <circle cx="5" cy="-4" r="4" fill="#10B981" class="live-dot"/>
    <text x="18" y="0" fill="#94A3B8" font-size="13" font-weight="500" class="font-sans">Ultra-Minimalist Vector Engineering for GitHub</text>
  </g>

  <!-- Modern Specs Pills -->
    <g transform="translate(36, 132)">
      <rect x="0" y="0" width="83" height="28" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1"/>
      <text x="14" y="18" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">CORE:</text>
      <text x="47" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">V6.5</text>
    </g>
    <g transform="translate(131, 132)">
      <rect x="0" y="0" width="129" height="28" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1"/>
      <text x="14" y="18" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">LATENCY:</text>
      <text x="67" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">&lt;35ms</text>
    </g>
    <g transform="translate(272, 132)">
      <rect x="0" y="0" width="122" height="28" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1"/>
      <text x="14" y="18" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">IMMUNITY:</text>
      <text x="80" y="18" fill="var(--accent)" font-size="11" font-weight="600" class="font-sans">100%</text>
    </g>

  <!-- Modern Upper-Right Tag Badge -->
  <g transform="translate(680, 32)">
    <rect x="0" y="0" width="138" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1"/>
    <circle cx="16" cy="16" r="3.5" fill="#38BDF8"/>
    <text x="75" y="20" fill="#F8FAFC" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">SYSTEM_ACTIVE</text>
  </g>
</svg>