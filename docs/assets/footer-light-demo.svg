<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 76" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkLed { 0%, 100% { fill: #0969DA; opacity: 1; } 50% { fill: #D0D7DE; opacity: 0.3; } }
      .led { animation: blinkLed 1.8s infinite steps(1); }
    </style>
  </defs>
  <!-- Cyberpunk Heavy Chassis -->
  <rect x="1" y="2" width="848" height="72" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
  <rect x="4" y="5" width="842" height="66" fill="none" stroke="#0969DA" stroke-width="1" opacity="0.6"/>

  <!-- 4 Corner Pixel Brackets 6x6 -->
  <rect x="1" y="2" width="6" height="6" fill="#0969DA"/>
  <rect x="843" y="2" width="6" height="6" fill="#0969DA"/>
  <rect x="1" y="68" width="6" height="6" fill="#8250DF"/>
  <rect x="843" y="68" width="6" height="6" fill="#8250DF"/>

  <!-- Top Micro-Rail -->
  <line x1="12" y1="9" x2="838" y2="9" stroke="#0969DA" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
  <text x="14" y="16" fill="#8250DF" font-size="11" font-weight="bold" class="font-mono">[SYS_EOF: 0x00FF]</text>
  <text x="836" y="16" fill="#8250DF" font-size="11" font-weight="bold" text-anchor="end" class="font-mono">// BUS_SPEED: 64Gbps //</text>

  <!-- Left Main Status Readout -->
  <circle cx="26" cy="35" r="4.5" fill="#0969DA" class="led"/>
  <circle cx="26" cy="35" r="1.5" fill="#CF222E"/>
  <rect x="38" y="26" width="76" height="18" fill="#EAEFF5" stroke="#8250DF" stroke-width="1.2"/>
  <text x="76" y="38" fill="#8250DF" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">SYS_STATUS</text>
  <text x="124" y="40" fill="#0969DA" font-size="12" font-weight="bold" class="font-mono">SYSTEM STANDBY // VERIFIED INTE...</text>

  <!-- Secondary Diagnostics Sub-line -->
  <text x="24" y="61" fill="#57606A" font-size="11" class="font-mono"><tspan fill="#8250DF">RUNTIME:</tspan> BUFFER_CLEARED <tspan fill="rgba(148, 163, 184, 0.4)">|</tspan> <tspan fill="#8250DF">PACKET_LOSS:</tspan> 0.00% <tspan fill="rgba(148, 163, 184, 0.4)">|</tspan> <tspan fill="#8250DF">LINK_QUALITY:</tspan> 100%_LOCKED</text>

  <!-- Center PCB Pulse / Mini Matrix -->
  <g transform="translate(390, 30)">
    <line x1="0" y1="6" x2="70" y2="6" stroke="#D0D7DE" stroke-width="2"/>
    <line x1="0" y1="6" x2="35" y2="6" stroke="#8250DF" stroke-width="2"/>
    <circle cx="0" cy="6" r="3" fill="#0969DA"/>
    <circle cx="70" cy="6" r="3" fill="#8250DF"/>
    <rect x="25" y="0" width="20" height="12" fill="#F6F8FA" stroke="#0969DA" stroke-width="1"/>
    <text x="35" y="9" fill="#0969DA" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">EOF</text>
  </g>

  <!-- Right Return To Top Button -->
  <g transform="translate(655, 22)" class="btn-hover">
    <rect x="0" y="0" width="180" height="36" fill="rgba(0, 200, 215, 0.16)" stroke="#0969DA" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="4" fill="#8250DF"/>
    <rect x="176" y="0" width="4" height="4" fill="#8250DF"/>
    <rect x="0" y="32" width="4" height="4" fill="#8250DF"/>
    <rect x="176" y="32" width="4" height="4" fill="#8250DF"/>
    <text x="90" y="21" fill="#0969DA" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">RETURN TO TOP</text>
    <text x="90" y="31" fill="#8250DF" font-size="11" text-anchor="middle" class="font-mono">[ CLICK TO RETURN ]</text>
  </g>

  <!-- Bottom Grounding Notch -->
  <line x1="20" y1="73" x2="830" y2="73" stroke="#0969DA" stroke-width="1" opacity="0.4"/>
  <polygon points="400 73, 450 73, 443 75, 407 75" fill="#0969DA"/>
</svg>