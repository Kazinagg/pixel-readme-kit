<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
        <linearGradient id="modern-starchart-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="modern-starchart-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="rgba(51, 65, 85, 0.85)" stop-opacity="0.3" />
    </linearGradient>
    <style>
      
      
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
    <linearGradient id="modern-star-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- MODERN CHASSIS -->
  <rect x="2" y="2" width="846" height="226" rx="14" fill="rgba(15, 23, 42, 0.90)" stroke="url(#modern-starchart-border-grad)" stroke-width="1.2"/>
  <path d="M 16 2 L 834 2" stroke="url(#modern-starchart-accent-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- HEADER -->
  <g transform="translate(20, 18)">
    <circle cx="8" cy="14" r="3.5" fill="#10B981"/>
    <text x="18" y="18" fill="#F8FAFC" font-size="12" font-weight="700" letter-spacing="0.03em" class="font-sans">STAR GROWTH TRAJECTORY</text>
    <text x="187" y="18" fill="#94A3B8" font-size="11" class="font-mono">/ Kazinagg/pixel-readme-kit</text>
  </g>

  <!-- STATS PILLS -->
  <g transform="translate(650, 18)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1"/>
    <text x="43" y="16" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 1,450</text>
    <rect x="94" y="0" width="86" height="24" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="#818CF8" stroke-width="1"/>
    <text x="137" y="16" fill="#818CF8" font-size="10.5" font-weight="600" text-anchor="middle" class="font-sans">+120% 6m</text>
  </g>

