  <line x1="65" y1="186.0" x2="810" y2="186.0" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="146.7" x2="810" y2="146.7" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="107.3" x2="810" y2="107.3" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/><line x1="65" y1="68.0" x2="810" y2="68.0" stroke="rgba(51, 65, 85, 0.85)" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <text x="55" y="189.5" fill="#94A3B8" font-size="10" text-anchor="end" class="font-mono">0</text><text x="55" y="150.2" fill="#94A3B8" font-size="10" text-anchor="end" class="font-mono">483</text><text x="55" y="110.8" fill="#94A3B8" font-size="10" text-anchor="end" class="font-mono">966</text><text x="55" y="71.5" fill="#94A3B8" font-size="10" text-anchor="end" class="font-mono">1.4k</text>
  <text x="65.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-5</text><text x="214.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-4</text><text x="363.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-3</text><text x="512.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-2</text><text x="661.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">M-1</text><text x="810.0" y="204" fill="#94A3B8" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">NOW</text>

  <!-- CHART AREA & BEZIER SPLINE -->
  <path d="M 65.0 186 L 65.0 185.0 C 132.1 185.0, 146.9 182.3, 214.0 182.3 C 281.1 182.3, 295.9 176.2, 363.0 176.2 C 430.1 176.2, 444.9 155.1, 512.0 155.1 C 579.0 155.1, 594.0 119.3, 661.0 119.3 C 728.0 119.3, 743.0 68.0, 810.0 68.0 L 810.0 186 Z" fill="url(#modern-star-area)" shape-rendering="geometricPrecision"/>
  <path d="M 65.0 185.0 C 132.1 185.0, 146.9 182.3, 214.0 182.3 C 281.1 182.3, 295.9 176.2, 363.0 176.2 C 430.1 176.2, 444.9 155.1, 512.0 155.1 C 579.0 155.1, 594.0 119.3, 661.0 119.3 C 728.0 119.3, 743.0 68.0, 810.0 68.0" fill="none" stroke="url(#modern-starchart-accent-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision"/>

  <!-- DATA VERTICES -->
  <circle cx="65.0" cy="185.0" r="3" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1.5"/><circle cx="214.0" cy="182.3" r="3" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1.5"/><circle cx="363.0" cy="176.2" r="3" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1.5"/><circle cx="512.0" cy="155.1" r="3" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1.5"/><circle cx="661.0" cy="119.3" r="3" fill="rgba(30, 41, 59, 0.85)" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Peak Milestone Marker -->
    <circle cx="810.0" cy="68.0" r="8" fill="#818CF8" opacity="0.2"/>
    <circle cx="810.0" cy="68.0" r="5" fill="rgba(15, 23, 42, 0.90)" stroke="#818CF8" stroke-width="2"/>
    <circle cx="810.0" cy="68.0" r="2" fill="#38BDF8"/>
    <!-- Peak Callout Pill -->
    <g transform="translate(760.0, 38.0)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="rgba(30, 41, 59, 0.85)" stroke="#818CF8" stroke-width="1.2"/>
      <text x="38" y="15" fill="#818CF8" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">★ 1,450</text>
