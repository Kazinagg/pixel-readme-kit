<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(20, 14, 6, 0.88);
        --bg-panel: rgba(30, 22, 10, 0.82);
        --border-chassis: rgba(50, 36, 16, 0.85);
        --primary: #F59E0B;
        --accent: #EA580C;
        --tertiary: #EF4444;
        --title-front: #F59E0B;
        --title-mid: #92400E;
        --title-dark: #451A03;
        --text-main: #FFFBEB;
        --text-dim: #D97706;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(20, 14, 6, 0.88);
          --bg-panel: rgba(30, 22, 10, 0.82);
          --border-chassis: rgba(50, 36, 16, 0.85);
          --primary: #F59E0B;
          --accent: #EA580C;
          --tertiary: #EF4444;
          --title-front: #F59E0B;
          --title-mid: #92400E;
          --title-dark: #451A03;
          --text-main: #FFFBEB;
          --text-dim: #D97706;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FFFBEB;
          --bg-panel: #FEF3C7;
          --border-chassis: #FDE68A;
          --primary: #B45309;
          --accent: #C2410C;
          --tertiary: #B91C1C;
          --title-front: #B45309;
          --title-mid: #78350F;
          --title-dark: #451A03;
          --text-main: #1F2937;
          --text-dim: #6B7280;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #F59E0B));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Body Chassis -->
  <rect x="2" y="2" width="846" height="44" fill="var(--bg-glass)" stroke="#d29922" stroke-width="1.5"/><rect x="2" y="2" width="5" height="5" fill="#d29922"/><rect x="843" y="2" width="5" height="5" fill="#d29922"/><rect x="2" y="41" width="5" height="5" fill="#d29922"/><rect x="843" y="41" width="5" height="5" fill="#d29922"/>
  <!-- Badges & Accents -->
  <rect x="14" y="10" width="140" height="28" fill="var(--bg-panel)" stroke="#d29922" stroke-width="1.5"/><circle cx="26" cy="24" r="3.5" fill="#d29922"/><text x="90" y="28" fill="#d29922" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">WARNING // 0x01</text>
  <rect x="815" y="14" width="20" height="20" fill="var(--bg-panel)"/><text x="825" y="28" fill="#d29922" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">ℹ</text>
  <!-- Text Content (Properly offset past badge edge) -->
  <text x="168" y="22" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">EXTERNAL API DEPENDENCY WARNING</text>
  <text x="168" y="36" fill="var(--accent)" font-size="11" class="font-mono">Shields.io and dynamic PNG services suffer downtime. Standalone SVGs do not.</text>
</svg>