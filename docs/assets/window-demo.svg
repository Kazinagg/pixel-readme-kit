  <!-- UPWARD PRONGS (FLUSH TO EDGES x=1..849) -->
  <line x1="1" y1="0" x2="1" y2="12" stroke="var(--primary)" stroke-width="2.5"/><rect x="0" y="0" width="4" height="5" fill="var(--primary)"/>
  <line x1="849" y1="0" x2="849" y2="12" stroke="var(--primary)" stroke-width="2.5"/><rect x="846" y="0" width="4" height="5" fill="var(--primary)"/>
  <line x1="1" y1="12" x2="849" y2="12" stroke="var(--border-chassis)" stroke-width="3"/>
