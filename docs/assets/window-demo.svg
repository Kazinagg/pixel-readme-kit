          --title-mid: #006B74;
          --title-dark: #002B2F;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #00D26A;
          --warning: #F59E0B;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F6F8FA;
          --bg-panel: #EAEFF5;
          --border-chassis: #D0D7DE;
          --primary: #0969DA;
          --accent: #8250DF;
          --tertiary: #CF222E;
          --title-front: #0969DA;
          --title-mid: #0550AE;
          --title-dark: #033D8B;
          --text-main: #1F2328;
          --text-dim: #57606A;
          --status: #1A7F37;
          --warning: #9A6700;
          --grid-op: 0.10;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #00C8D7));
