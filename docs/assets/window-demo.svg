  <path d="M 849 12 L 849 20 L 834 20" fill="none" stroke="var(--primary)" stroke-width="1.5"/><rect x="845" y="17" width="4" height="4" fill="var(--accent)"/>
  <rect x="320" y="4" width="210" height="16" fill="var(--bg-glass)" stroke="var(--accent)" stroke-width="1"/>
  <text x="425" y="15" fill="var(--primary)" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[OPEN_HUD]</text>

  </g>
