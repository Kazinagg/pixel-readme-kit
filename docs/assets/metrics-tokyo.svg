<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 98" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: #F6F8FA;
        --bg-panel: #EAEFF5;
        --border-chassis: #D0D7DE;
        --primary: #5571ac;
        --accent: #5790b2;
        --tertiary: #5790b2;
        --title-front: #5571ac;
        --title-mid: #334367;
        --title-dark: #192133;
        --text-main: #1F2328;
        --text-dim: #57606A;
        --status: #6e904a;
        --warning: #9c7a48;
        --grid-op: 0.10;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(15, 18, 28, 0.75);
          --bg-panel: rgba(15, 23, 38, 0.82);
          --border-chassis: rgba(35, 42, 65, 0.85);
          --primary: #7AA2F7;
          --accent: #7DCFFF;
          --tertiary: #7DCFFF;
          --title-front: #7AA2F7;
          --title-mid: #36486f;
          --title-dark: #121825;
          --text-main: #F8F8F2;
          --text-dim: #94A3B8;
          --status: #9ECE6A;
          --warning: #E0AF68;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #7AA2F7));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-mono-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
      .font-mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-mono-tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g id="metric-card-0">
    
    <rect x="1" y="3" width="848" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.5"/>
    <line x1="1" y1="11" x2="1" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="3" x2="9" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="841" y1="3" x2="849" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <line x1="849" y1="3" x2="849" y2="11" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="87" x2="1" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="1" y1="95" x2="9" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="841" y1="95" x2="849" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <line x1="849" y1="87" x2="849" y2="95" stroke="var(--primary)" stroke-width="2"/>
    <rect x="7" y="9" width="2" height="2" fill="var(--accent)"/>

    <text x="15" y="25" fill="var(--text-dim)" class="font-mono-lbl">SYSTEM METRIC</text>
    
    <text x="15" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">100%</text>
    <text x="15" y="79" fill="var(--text-dim)" class="font-mono-sub">● +0%</text>
    
    <path d="M 795 81 L 805 75 L 815 83 L 825 71 L 835 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="835" cy="77" r="2" fill="var(--accent)"/>

  </g>
</svg>