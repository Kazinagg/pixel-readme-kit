<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="100%">
  <defs>
        <linearGradient id="modern-profile-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="modern-profile-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.3" />
    </linearGradient>
    <style>
      
      
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
  </defs>

  <!-- CHASSIS -->
  <rect x="2" y="2" width="846" height="186" rx="14" fill="#F8FAFC" stroke="url(#modern-profile-border-grad)" stroke-width="1.2"/>
  <path d="M 16 2 L 834 2" stroke="url(#modern-profile-accent-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- CIRCULAR AVATAR WITH GRADIENT RING -->
  <g>
    <!-- Outer halo ring -->
    <circle cx="95" cy="87" r="46" fill="none" stroke="url(#modern-profile-accent-grad)" stroke-width="2"/>
    <!-- Inner panel circle -->
    <circle cx="95" cy="87" r="43" fill="#F1F5F9"/>
    <!-- Vector User Silhouette -->
    <circle cx="95" cy="77" r="15" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <path d="M 71 113 C 71 95, 119 95, 119 113 Z" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <circle cx="95" cy="77" r="5" fill="#4F46E5"/>
  </g>

  <!-- STATUS PILL (UNDER AVATAR) -->
  <g transform="translate(53, 144)">
    <rect x="0" y="0" width="84" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="12" cy="10" r="3" fill="#16A34A"/>
    <text x="20" y="13.5" fill="#16A34A" font-size="9.5" font-weight="700" class="font-sans">ACTIVE</text>
  </g>

  <!-- BADGE AND LOCATION PILLS (TOP RIGHT) -->
  <g transform="translate(636, 24)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#F1F5F9" stroke="#4F46E5" stroke-width="1"/>
    <text x="34" y="16" fill="#4F46E5" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">TIER_1</text>
    <rect x="76" y="0" width="114" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="133" y="16" fill="#64748B" font-size="10.5" font-weight="500" text-anchor="middle" class="font-sans">REMOTE // UTC+3</text>
  </g>

  <!-- NAME TYPOGRAPHY -->
  <text x="180" y="56" fill="url(#modern-profile-accent-grad)" font-size="26" font-weight="800" letter-spacing="-0.02em" class="font-sans">MODERN DEVELOPER</text>

  <!-- ROLE PILL -->
  <g transform="translate(180, 72)">
    <rect x="0" y="0" width="231" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="16" fill="#4F46E5" font-size="11.5" font-weight="600" class="font-sans">SYSTEMS &amp; CLOUD ARCHITECT</text>
  </g>

  <!-- BIO SUMMARY -->
  <text x="180" y="128" fill="#0F172A" font-size="12.5" font-weight="400" class="font-sans">Engineering deterministic SVG instruments and resilient developer runtimes.</text>
</svg>