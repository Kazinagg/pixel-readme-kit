<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(24, 24, 27, 0.88);
        --bg-panel: rgba(39, 39, 42, 0.82);
        --border-chassis: rgba(63, 63, 70, 0.85);
        --primary: #60A5FA;
        --accent: #F59E0B;
        --tertiary: #38BDF8;
        --title-front: #93C5FD;
        --title-mid: #3B82F6;
        --title-dark: #1D4ED8;
        --text-main: #F4F4F5;
        --text-dim: #A1A1AA;
        --status: #10B981;
        --warning: #D97706;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(24, 24, 27, 0.88);
          --bg-panel: rgba(39, 39, 42, 0.82);
          --border-chassis: rgba(63, 63, 70, 0.85);
          --primary: #60A5FA;
          --accent: #F59E0B;
          --tertiary: #38BDF8;
          --title-front: #93C5FD;
          --title-mid: #3B82F6;
          --title-dark: #1D4ED8;
          --text-main: #F4F4F5;
          --text-dim: #A1A1AA;
          --status: #10B981;
          --warning: #D97706;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FAFAF9;
          --bg-panel: #F5F5F4;
          --border-chassis: #E7E5E4;
          --primary: #1C1917;
          --accent: #B45309;
          --tertiary: #2563EB;
          --title-front: #1C1917;
          --title-mid: #44403C;
          --title-dark: #78716C;
          --text-main: #1C1917;
          --text-dim: #78716C;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #60A5FA));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>

  
  <!-- CORPORATE / ACADEMIC FORMAL SPECIFICATION DOSSIER -->
  <rect x="1" y="1" width="848" height="188" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="180" fill="none" stroke="var(--border-chassis)" stroke-width="0.8" opacity="0.6"/>
  <line x1="5" y1="5" x2="845" y2="5" stroke="var(--primary)" stroke-width="2.5"/>
  <line x1="5" y1="185" x2="845" y2="185" stroke="var(--border-chassis)" stroke-width="1"/>
  <text x="832" y="180" fill="var(--text-dim)" font-size="8.5" text-anchor="end" class="font-mono">IDENTIFICATION PROTOCOL // VERIFIED</text>


  
  <!-- CLEAN MINIMALIST AVATAR -->
  <g transform="translate(28, 28)">
    <rect x="0" y="0" width="134" height="134" rx="12" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1.2"/>
    <!-- Smooth User Silhouette (Pure Vector) -->
    <circle cx="67" cy="48" r="22" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.8"/>
    <path d="M 28 98 C 28 76, 106 76, 106 98 Z" fill="var(--bg-glass)" stroke="var(--primary)" stroke-width="1.8"/>
    <circle cx="67" cy="48" r="8" fill="var(--accent)"/>
    <!-- Minimalist Status Indicator -->
    <rect x="16" y="108" width="102" height="18" rx="9" fill="var(--bg-glass)" stroke="var(--status)" stroke-width="1"/>
    <circle cx="28" cy="117" r="3" fill="var(--status)"/>
    <text x="36" y="120" fill="var(--status)" font-size="8.5" font-weight="600" class="font-mono">ACTIVE</text>
  </g>


  <!-- TOP BREADCRUMB -->
  <rect x="180" y="24" width="198" height="24" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
  <text x="192" y="40" fill="var(--primary)" font-size="11" font-weight="bold" class="font-mono">DOSSIER // OXFORD // UTC+0</text>

  <!-- BADGE AND STATUS PILLS (TOP RIGHT) -->
  <g transform="translate(659, 24)">
    <rect x="0" y="0" width="70" height="24" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="35" y="16" fill="var(--accent)" font-size="10.5" font-weight="bold" text-anchor="middle" class="font-mono">SCHOLAR</text>
    <rect x="78" y="0" width="93" height="24" fill="var(--bg-panel)" stroke="var(--status)" stroke-width="1"/>
    <circle cx="90" y="12" r="3" fill="var(--status)"/>
    <text x="130" y="16" fill="var(--status)" font-size="10" font-weight="bold" text-anchor="middle" class="font-mono">FELLOWSHIP</text>
  </g>

  <!-- NAME TYPOGRAPHY -->
    <text x="180" y="78" fill="var(--title-front)" font-size="26" font-weight="700" letter-spacing="0.04em" class="font-mono">A. KAZINAGG, M.SC.</text>

  <!-- ROLE PILL -->
  
  <g transform="translate(180, 116)">
    <rect x="0" y="0" width="240" height="26" rx="4" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="26" rx="1.5" fill="var(--primary)"/>
    <text x="12" y="17" fill="var(--accent)" font-size="11.5" font-weight="600" class="font-mono">▶ RESEARCH SOFTWARE ENGINEER</text>
  </g>


  <!-- BIO SUMMARY -->
  <text x="182" y="166" fill="var(--text-main)" font-size="12" font-weight="normal" class="font-mono">Specialized in deterministic compilation, vector asset optimization, and autonomous...</text>
</svg>