<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 72" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(6, 20, 16, 0.92);
        --bg-panel: rgba(12, 34, 27, 0.86);
        --border-chassis: rgba(20, 60, 48, 0.85);
        --primary: #10B981;
        --accent: #34D399;
        --tertiary: #059669;
        --title-front: #34D399;
        --title-mid: #059669;
        --title-dark: #047857;
        --text-main: #ECFDF5;
        --text-dim: #6EE7B7;
        --status: #10B981;
        --warning: #F59E0B;
        --grid-op: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(6, 20, 16, 0.92);
          --bg-panel: rgba(12, 34, 27, 0.86);
          --border-chassis: rgba(20, 60, 48, 0.85);
          --primary: #10B981;
          --accent: #34D399;
          --tertiary: #059669;
          --title-front: #34D399;
          --title-mid: #059669;
          --title-dark: #047857;
          --text-main: #ECFDF5;
          --text-dim: #6EE7B7;
          --status: #10B981;
          --warning: #F59E0B;
          --grid-op: 0.07;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F0FDF4;
          --bg-panel: #DCFCE7;
          --border-chassis: #BBF7D0;
          --primary: #15803D;
          --accent: #16A34A;
          --tertiary: #166534;
          --title-front: #14532D;
          --title-mid: #15803D;
          --title-dark: #166534;
          --text-main: #14532D;
          --text-dim: #166534;
          --status: #15803D;
          --warning: #CA8A04;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #10B981));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, monospace; }
    .btn-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .btn-hover:hover { opacity: 0.85; }

    </style>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="100%" stop-color="var(--accent)" />
    </linearGradient>
  </defs>

  <!-- Modern Card Background -->
  <rect x="2" y="2" width="846" height="68" rx="12" fill="var(--bg-glass)" stroke="var(--border-chassis)" stroke-width="1.2"/>

  <!-- Label & Percentage Pill -->
  <text x="18" y="22" fill="var(--text-main)" font-size="12" font-weight="600" class="font-sans">PRODUCTION ROBUSTNESS</text>
  <g transform="translate(774, 9)">
    <rect x="0" y="0" width="58" height="20" rx="10" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <text x="29" y="14" fill="var(--primary)" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">88%</text>
  </g>

  <!-- Continuous Track & Filled Bar -->
  <rect x="18" y="34" width="814" height="10" rx="5" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
  <rect x="18" y="34" width="716.3" height="10" rx="5" fill="url(#progGrad)"/>

  <!-- Subtext & Milestone Indicators -->
  <text x="18" y="58" fill="var(--text-dim)" font-size="11" font-weight="500" class="font-sans">CONTINUOUS GRADIENT PROGRESS</text>
  <text x="832" y="58" fill="var(--text-dim)" font-size="11" font-weight="500" text-anchor="end" class="font-sans">0% • 50% • 100%</text>
</svg>