<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(10, 20, 32, 0.92);
        --bg-panel: rgba(16, 30, 48, 0.85);
        --border-chassis: rgba(38, 64, 98, 0.85);
        --primary: #E0F2FE;
        --accent: #38BDF8;
        --tertiary: #7DD3FC;
        --title-front: #F0F9FF;
        --title-mid: #BAE6FD;
        --title-dark: #38BDF8;
        --text-main: #F0F9FF;
        --text-dim: #94A3B8;
        --status: #34D399;
        --warning: #FBBF24;
        --grid-op: 0.08;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(10, 20, 32, 0.92);
          --bg-panel: rgba(16, 30, 48, 0.85);
          --border-chassis: rgba(38, 64, 98, 0.85);
          --primary: #E0F2FE;
          --accent: #38BDF8;
          --tertiary: #7DD3FC;
          --title-front: #F0F9FF;
          --title-mid: #BAE6FD;
          --title-dark: #38BDF8;
          --text-main: #F0F9FF;
          --text-dim: #94A3B8;
          --status: #34D399;
          --warning: #FBBF24;
          --grid-op: 0.08;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #F0F9FF;
          --bg-panel: #E0F2FE;
          --border-chassis: #BAE6FD;
          --primary: #0369A1;
          --accent: #0284C7;
          --tertiary: #075985;
          --title-front: #0C4A6E;
          --title-mid: #075985;
          --title-dark: #0369A1;
          --text-main: #0C4A6E;
          --text-dim: #0369A1;
          --status: #059669;
          --warning: #D97706;
          --grid-op: 0.08;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #E0F2FE));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>
  <!-- Body Chassis -->
  <rect x="2" y="2" width="846" height="44" fill="var(--bg-glass)" stroke="#238636" stroke-width="1.5"/><rect x="2" y="2" width="5" height="5" fill="#238636"/><rect x="843" y="2" width="5" height="5" fill="#238636"/><rect x="2" y="41" width="5" height="5" fill="#238636"/><rect x="843" y="41" width="5" height="5" fill="#238636"/>
  <!-- Badges & Accents -->
  <rect x="14" y="10" width="140" height="28" fill="var(--bg-panel)" stroke="#238636" stroke-width="1.5"/><circle cx="26" cy="24" r="3.5" fill="#238636"/><text x="90" y="28" fill="#238636" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">SUCCESS // 0x01</text>
  <rect x="815" y="14" width="20" height="20" fill="var(--bg-panel)"/><text x="825" y="28" fill="#238636" font-size="11" font-weight="bold" text-anchor="middle" class="font-mono">ℹ</text>
  <!-- Text Content (Properly offset past badge edge) -->
  <text x="168" y="22" fill="var(--text-main)" font-size="11" font-weight="bold" letter-spacing="0.5" class="font-mono">DUAL THEME COMPLIANCE CERTIFIED</text>
  <text x="168" y="36" fill="var(--accent)" font-size="11" class="font-mono">Single SVG adapts automatically to prefers-color-scheme: dark and light.</text>
</svg>