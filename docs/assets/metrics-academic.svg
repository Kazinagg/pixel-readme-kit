<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 98" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      
      :root {
        --bg-glass: rgba(24, 24, 27, 0.88);
        --bg-panel: rgba(39, 39, 42, 0.82);
        --border-chassis: rgba(63, 63, 70, 0.85);
        --primary: #60A5FA;
        --accent: #F59E0B;
        --tertiary: #38BDF8;
        --title-front: #93C5FD;
        --title-mid: #3B82F6;
        --title-dark: #1D4ED8;
        --text-main: #F4F4F5;
        --text-dim: #A1A1AA;
        --status: #10B981;
        --warning: #D97706;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(24, 24, 27, 0.88);
          --bg-panel: rgba(39, 39, 42, 0.82);
          --border-chassis: rgba(63, 63, 70, 0.85);
          --primary: #60A5FA;
          --accent: #F59E0B;
          --tertiary: #38BDF8;
          --title-front: #93C5FD;
          --title-mid: #3B82F6;
          --title-dark: #1D4ED8;
          --text-main: #F4F4F5;
          --text-dim: #A1A1AA;
          --status: #10B981;
          --warning: #D97706;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FAFAF9;
          --bg-panel: #F5F5F4;
          --border-chassis: #E7E5E4;
          --primary: #1C1917;
          --accent: #B45309;
          --tertiary: #2563EB;
          --title-front: #1C1917;
          --title-mid: #44403C;
          --title-dark: #78716C;
          --text-main: #1C1917;
          --text-dim: #78716C;
          --status: #15803D;
          --warning: #B45309;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #60A5FA));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }

      .font-mono-lbl { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .font-mono-val { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
      .font-mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: bold; }
      .font-mono-tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g id="metric-card-0">
    
    <rect x="1" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="1" y1="3" x2="204" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="198" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="15" y="25" fill="var(--text-dim)" class="font-mono-lbl">GITHUB STARS</text>
    
    <text x="15" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">1,980</text>
    <text x="15" y="79" fill="var(--status)" class="font-mono-sub">▲ +45 this week</text>
    
    <path d="M 150 81 L 160 75 L 170 83 L 180 71 L 190 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="190" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-1">
    
    <rect x="216" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="216" y1="3" x2="419" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="413" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="230" y="25" fill="var(--text-dim)" class="font-mono-lbl">ENGINE RENDER</text>
    
    <text x="230" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">38ms</text>
    <text x="230" y="79" fill="var(--text-dim)" class="font-mono-sub">● Stdlib zero-dep</text>
    
    <path d="M 365 81 L 375 75 L 385 83 L 395 71 L 405 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="405" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-2">
    
    <rect x="431" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="431" y1="3" x2="634" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="628" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="445" y="25" fill="var(--text-dim)" class="font-mono-lbl">TEST COVERAGE</text>
    
    <text x="445" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">100%</text>
    <text x="445" y="79" fill="var(--status)" class="font-mono-sub">▲ 148 unit tests</text>
    
    <path d="M 580 81 L 590 75 L 600 83 L 610 71 L 620 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="620" cy="77" r="2" fill="var(--accent)"/>

  </g>
  <g id="metric-card-3">
    
    <rect x="646" y="3" width="203" height="92" fill="var(--bg-panel)" stroke="var(--border-chassis)" stroke-width="1"/>
    <line x1="646" y1="3" x2="849" y2="3" stroke="var(--primary)" stroke-width="2"/>
    <rect x="843" y="9" width="2" height="2" fill="var(--primary)"/>

    <text x="660" y="25" fill="var(--text-dim)" class="font-mono-lbl">CAMO STATUS</text>
    <rect x="779" y="13" width="58" height="13" fill="var(--bg-panel)" stroke="var(--accent)" stroke-width="1"/>
    <text x="808" y="23" fill="var(--accent)" text-anchor="middle" class="font-mono-tag">OPTIMAL</text>
    <text x="660" y="57" fill="var(--title-front)" font-size="26" class="font-mono-val">IMMUNE</text>
    <text x="660" y="79" fill="var(--text-dim)" class="font-mono-sub">● Hash-versioned</text>
    
    <path d="M 795 81 L 805 75 L 815 83 L 825 71 L 835 77" fill="none" stroke="var(--primary)" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="835" cy="77" r="2" fill="var(--accent)"/>

  </g>
</svg>